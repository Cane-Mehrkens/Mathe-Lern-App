let state=loadState();let activeQuiz=null;
function emptyState(){return {history:[],currentQuiz:null}}
function questionExists(id){return QUESTIONS.some(q=>q.id===id)}
function sanitizeState(raw){
 const clean=emptyState();
 if(!raw||typeof raw!=='object')return clean;
 clean.history=Array.isArray(raw.history)?raw.history.filter(Boolean):[];
 const qz=raw.currentQuiz;
 if(qz&&Array.isArray(qz.ids)){
  const ids=qz.ids.filter(questionExists);
  if(ids.length){clean.currentQuiz={...qz,ids,index:Math.min(Math.max(Number(qz.index)||0,0),ids.length-1),answers:qz.answers&&typeof qz.answers==='object'?qz.answers:{}}}
 }
 return clean;
}
function loadState(){try{return sanitizeState(JSON.parse(localStorage.getItem(STORAGE_KEY)))}catch(e){return emptyState()}}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){console.warn('Speichern nicht möglich',e)}}
function repairBrokenQuiz(){state.currentQuiz=null;saveState();activeQuiz=null;app.innerHTML=`<section class="card"><p class="eyebrow">Speicher repariert</p><h1>Die Seite hatte einen alten/kaputten Quiz-Speicherstand.</h1><p class="lead">Ich habe nur das angefangene Quiz zurückgesetzt. Deine App ist nicht weg und du kannst normal neu starten.</p><div class="row"><button class="btn primary" onclick="renderSetup()">Neues Quiz starten</button><button class="btn secondary" onclick="renderHome()">Zur Startseite</button></div></section>`}

urseGrid">${COURSES.map(c=>`<article class="courseCard"><div class="courseIcon">${c.icon}</div><h3>${c.title}</h3><p>${c.desc}</p><div class="courseStats"><span class="tag">${countByCourse(c.id)} Aufgaben</span><span class="tag">${c.short}</span></div><button class="btn secondary" onclick="renderLearn('${c.id}')">Lernen</button> <button class="btn primary" onclick="startQuick('${c.id}')">Üben</button></article>`).join('')}</div></section>`}
function renderLearn(initial='all'){activeQuiz=null;app.innerHTML=`<section class="card"><p class="eyebrow">Lernmodus</p><h1>Begriffe suchen und Kapitel lernen</h1><p class="lead">Der Lernmodus erklärt genauer und mit Beispielen. Suche z. B. <span class="kbd">Pythagoras</span>, <span class="kbd">Kreis</span>, <span class="kbd">Fake Statistik</span>, <span class="kbd">Graph</span>, <span class="kbd">Steigung</span>, <span class="kbd">Rechenweg</span>.</p><div class="quickHelp"><div class="quickCard"><strong>🧠 Dyskalkulie-Hilfe</strong>Immer gleich: Gegeben → Gesucht → Formel → Einsetzen → Antwortsatz.</div><div class="quickCard"><strong>📈 Graphen-Hilfe</strong>Erst b an der y-Achse suchen, dann m mit einem Steigungsdreieck ablesen.</div><div class="quickCard"><strong>📊 Statistik-Check</strong>Achse, Einheit, Zeitraum, Stichprobe, Ausreißer prüfen.</div><div class="quickCard"><strong>🎥 Video-Hilfe</strong>Direkt passende Lehrerschmidt-Videos in der App ansehen.<br><button class="btn secondary" onclick="renderVideos()">Videos öffnen</button></div></div><div class="learnControls"><input id="searchInput" class="input search" placeholder="Begriff suchen …" oninput="renderLearnCards()"><select id="courseFilter" class="select" onchange="renderLearnCards()"><option value="all">Alle Kurse</option>${COURSES.map(c=>`<option value="${c.id}" ${initial===c.id?'selected':''}>${c.icon} ${c.title}</option>`).join('')}</select><select id="learnDepth" class="select" onchange="renderLearnCards()"><option value="full">Ausführlich</option><option value="short">Kurz</option></select></div></section><div class="spacer"></div><section id="learnCards" class="learnGrid"></section>`;renderLearnCards()}

function learnSearchText(item){return [item.title,item.text,item.formula,item.why,item.when,item.rule,item.example,item.mistake,...(item.terms||[]),...(item.steps||[]),...(item.examples||[])].join(' ')}
function learnExamplesHTML(item){if(!item.examples||!item.examples.length)return '';return `<div class="exampleBox"><strong>Weitere Beispiele:</strong><ul class="steps">${item.examples.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div>`}
function learnCardHTML(item,depth){const terms=(item.terms||[]).map(t=>`<span class="term">#${esc(t)}</span>`).join('');const steps=(item.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('');return `<div class="learnCard"><div class="terms">${terms}</div><h3>${esc(item.title)}</h3><p>${esc(item.text)}</p>${item.why?`<div class="exampleBox"><strong>Warum ist das wichtig?</strong> ${esc(item.why)}</div>`:''}<div class="formula">${esc(item.formula)}</div>${depth==='full'?`<details open><summary>So gehst du Schritt für Schritt vor</summary><ol class="steps">${steps}</ol></details><div class="exampleBox"><strong>Ausführliches Beispiel:</strong> ${esc(item.example)}</div>${learnExamplesHTML(item)}<p class="mistake"><strong>Häufiger Fehler:</strong> ${esc(item.mistake)}</p>`:`<p><strong>Kurzbeispiel:</strong> ${esc(item.example)}</p>`}<button class="btn secondary" onclick="startQuick('${item.course}')">Dazu üben</button></div>`}
function renderLearnCards(){const query=norm(document.getElementById('searchInput')?.value||'');const filter=document.getElementById('courseFilter')?.value||'all';const depth=document.getElementById('learnDepth')?.value||'full';const data=LEARN.filter(item=>{const hay=norm(learnSearchText(item));return (filter==='all'||item.course===filter)&&(!query||hay.includes(query))});const grouped=COURSES.map(c=>({c,items:data.filter(i=>i.course===c.id)})).filter(g=>g.items.length);const el=document.getElementById('learnCards');el.innerHTML=grouped.length?grouped.map(g=>`<article class="card learnChapter"><div class="spread"><h2>${g.c.icon} ${g.c.title}</h2><span class="tag">${g.items.length} Karten</span></div>${g.items.map(item=>learnCardHTML(item,depth)).join('')}</article>`).join(''):`<article class="card"><h2>Nichts gefunden</h2><p>Versuche einen anderen Begriff, z. B. „Steigung“, „Median“, „Pythagoras“, „Kreis“, „Einheit“ oder „Textaufgabe“.</p></article>`}
function renderSetup(){activeQuiz=null;app.innerHTML=`<section class="card"><p class="eyebrow">Quiz starten</p><h1>Kurse und Schwierigkeit auswählen</h1><p class="lead">Du kannst bei jedem Kurs einzeln einstellen, ob du einfache, normale, schwere oder gemischte Aufgaben willst. Notizen werden immer gespeichert; der Taschenrechner wird im Prüfungsmodus passend blockiert.</p><div class="setupGrid"><div><h2>Kurse</h2><div class="courseGrid">${COURSES.map(c=>`<label class="coursePick"><input type="checkbox" name="course" value="${c.id}" ${c.id.includes('lin')?'checked':''}><span><strong>${c.icon} ${c.title}</strong><small>${c.short} · ${countByCourse(c.id)} Aufgaben</small><select class="select" data-diff="${c.id}" onclick="event.stopPropagation()"><option value="easy">Einfach</option><option value="normal" selected>Normal</option><option value="hard">Schwer</option><option value="mix">Gemischt</option></select></span></label>`).join('')}</div></div><aside><h2>Optionen</h2><label><strong>Anzahl Fragen insgesamt</strong><select id="count" class="select"><option value="8">8 kurz</option><option value="12" selected>12 normal</option><option value="20">20 intensiv</option><option value="40">40 sehr intensiv</option><option value="all">Alle passenden</option></select></label><div class="spacer"></div><label><strong>Modus</strong><select id="mode" class="select"><option value="practice">Lern-Quiz mit Tipps</option><option value="exam">Prüfungsmodus gemischt</option></select></label><div class="spacer"></div><button class="btn primary" onclick="startFromSetup()">Starten</button><button class="btn secondary" onclick="toggleFormula(true)">Formeln öffnen</button><hr><p class="small">Tipp: Für lineare Funktionen am besten „Basics“, „Graphen“ und „Sachaufgaben“ zusammen wählen.</p></aside></div></section>`}
function startQuick(courseId){const spec={};spec[courseId]='mix';startQuiz({spec,count:10,mode:'practice',title:`${course(courseId).title} üben`})}
function continueQuiz(){if(!state.currentQuiz)return renderHome();activeQuiz=sanitizeState({history:[],currentQuiz:state.currentQuiz}).currentQuiz;if(!activeQuiz)return repairBrokenQuiz();state.currentQuiz=activeQuiz;saveState();renderQuiz()}
function startFromSetup(){const selected=[...document.querySelectorAll('input[name="course"]:checked')].map(x=>x.value);if(!selected.length){alert('Bitte mindestens einen Kurs auswählen.');return}const spec={};selected.forEach(id=>spec[id]=document.querySelector(`[data-diff="${id}"]`)?.value||'mix');const count=document.getElementById('count').value;const mode=document.getElementById('mode').value;startQuiz({spec,count,mode,title:'Eigenes Quiz'})}
function startQuiz({spec,count=12,mode='practice',title='Quiz',customIds=null}){let ids;if(customIds){ids=customIds.filter(questionExists)}else{let pool=QUESTIONS.filter(q=>spec[q.course]&&(spec[q.course]==='mix'||q.diff===spec[q.course]));if(pool.length<4){pool=QUESTIONS.filter(q=>spec[q.course])}ids=shuffle(pool.map(q=>q.id));if(count!=='all')ids=ids.slice(0,Number(count))}if(!ids.length){alert('Für diese Auswahl wurden keine Aufgaben gefunden. Bitte wähle einen anderen Kurs.');return}activeQuiz={ids,index:0,answers:{},mode,title,spec,startedAt:Date.now()};state.currentQuiz=activeQuiz;saveState();renderQuiz()}
function currentQ(){return activeQuiz&&Array.isArray(activeQuiz.ids)?QUESTIONS.find(q=>q.id===activeQuiz.ids[activeQuiz.index]):null}
function renderQuiz(){if(!activeQuiz)return renderHome();const q=currentQ();if(!q)return repairBrokenQuiz();const c=course(q.course);const saved=activeQuiz.answers[q.id];const pct=Math.round(activeQuiz.index/activeQuiz.ids.length*100);app.innerHTML=`<section class="quizLayout"><article class="card"><div class="spread"><span class="tag">${c.icon} ${c.title} · ${DIFFS[q.diff]} · ${esc(q.sub||'Aufgabe')}</span><span class="small">Frage ${activeQuiz.index+1} von ${activeQuiz.ids.length}</span></div><div class="spacer"></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="spacer"></div><h1 class="qTitle">${esc(q.prompt)}</h1><div class="answerBox">${answerHTML(q,saved)}</div><div id="tipBox"></div><div id="feedbackBox">${saved?.checked?feedbackHTML(q,saved):''}</div><div class="spacer"></div><div class="row noPrint"><button class="btn secondary" onclick="prevQ()" ${activeQuiz.index===0?'disabled':''}>← Zurück</button>${activeQuiz.mode==='exam'?'':`${activeQuiz.mode==='exam'?'<button class="btn secondary" disabled title="Im Prüfungsmodus gibt es Tipps erst am Ende.">💡 Tipp gesperrt</button>':'<button class="btn secondary" onclick="showTip()">💡 Tipp</button>'}`}<button class="btn danger" onclick="renderSetup()">Abbrechen</button><button id="nextBtn" class="btn primary grow" onclick="nextIntegrated()">${saved?.checked?(activeQuiz.index===activeQuiz.ids.length-1?'Ergebnis anzeigen':'Weiter →'):'Weiter'}</button></div></article><aside class="card quizSide noPrint"><h3>Navigation</h3><p class="small">Grün = richtig, rot = nochmal üben.</p><div class="qNav">${activeQuiz.ids.map((id,i)=>{const a=activeQuiz.answers[id];let cls=i===activeQuiz.index?'now ':'';if(a?.checked)cls+=a.warning?'warn':(a.correct?'good':'bad');return `<button class="dot ${cls}" onclick="jumpQ(${i})">${i+1}</button>`}).join('')}</div><hr><p><strong>Speicher:</strong> automatisch im Browser.</p><button class="btn secondary" onclick="saveState();alert('Gespeichert!')">Jetzt speichern</button><button class="btn secondary" onclick="toggleFormula(true)">📐 Formeln</button><button class="btn secondary" onclick="toggleNotes(true)">📝 Notizen</button><button class="btn secondary" onclick="toggleCalculator(true)">🧮 Taschenrechner</button><p class="small" id="calcStatusInline" style="margin-top:10px"></p></aside></section>`;setTimeout(updateToolAvailability,0)}
function mediaHTML(q){let out='';if(q.graph)out+=`<div class="mediaBox"><p class="mediaTitle">Graph / Koordinatensystem</p>${graphSVG(q.graph)}${q.graph.caption?`<p class="graphCaption">${esc(q.graph.caption)}</p>`:''}</div>`;if(q.chart)out+=`<div class="mediaBox"><p class="mediaTitle">Statistik-Diagramm</p>${chartSVG(q.chart)}${q.chart.warn?`<span class="chartWarn">${esc(q.chart.warn)}</span>`:''}</div>`;if(q.figure)out+=`<div class="mediaBox"><p class="mediaTitle">Skizze</p>${figureSVG(q.figure)}</div>`;return out}
function answerHTML(q,saved){
 const val=saved?.value??'';const media=mediaHTML(q);
 if(q.type==='graphSlider'){
  const checked=!!saved?.checked;
  const ans=q.answer||{};
  const mStart=(typeof val==='object'&&val)?Number(val.m):(q.start?.m??0);
  const bStart=(typeof val==='object'&&val)?Number(val.b):(q.start?.b??0);
  const mMin=q.slider?.mMin??Math.floor(Math.min(-4,Number(ans.m??0)-2));
  const mMax=q.slider?.mMax??Math.ceil(Math.max(4,Number(ans.m??0)+2));
  const bMin=q.slider?.bMin??Math.floor(Math.min(-5,Number(ans.b??0)-5));
  const bMax=q.slider?.bMax??Math.ceil(Math.max(5,Number(ans.b??0)+5));
  const mStep=q.slider?.mStep??0.5;
  const bStep=q.slider?.bStep??(Math.abs(bMax-bMin)>20?1:0.5);
  const disabled=checked?'disabled aria-disabled="true"':'';
  const lockNote=checked?'<p class="small">Antwort wurde schon geprüft. Die Regler sind gesperrt, damit die Auswertung nicht falsch wirkt.</p>':'';
  return `${media}<div class="mediaBox"><p class="mediaTitle">Interaktiver Graph</p><div id="sliderGraphWrap">${graphSVG(sliderGraphData(q,mStart,bStart))}</div><div class="sliderBox"><label class="sliderRow"><strong>m</strong><input id="mSlider" type="range" min="${mMin}" max="${mMax}" step="${mStep}" value="${mStart}" oninput="updateSliderGraph()" ${disabled}><span id="mVal">${fmt(mStart)}</span></label><label class="sliderRow"><strong>b</strong><input id="bSlider" type="range" min="${bMin}" max="${bMax}" step="${bStep}" value="${bStart}" oninput="updateSliderGraph()" ${disabled}><span id="bVal">${fmt(bStart)}</span></label></div><p class="graphCaption">b verschiebt die Gerade hoch/runter, m macht sie steiler oder fallend.</p>${lockNote}</div>`}
 if(q.type==='choice')return `${media}<div class="options">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="ans" value="${i}" ${String(val)===String(i)?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`;
 if(q.type==='multi'){const vals=Array.isArray(val)?val.map(String):[];return `${media}<div class="options">${q.options.map((o,i)=>`<label class="option"><input type="checkbox" name="ans" value="${i}" ${vals.includes(String(i))?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`}
 if(q.type==='order'){const vals=Array.isArray(val)?val:q.items.map((_,i)=>i+1);return `${media}<p class="muted">Wähle links die Reihenfolge: 1 = kleinster/erster Wert.</p>${q.items.map((it,i)=>`<div class="orderRow"><select data-order="${i}">${q.items.map((_,n)=>`<option value="${n+1}" ${Number(vals[i])===n+1?'selected':''}>${n+1}</option>`).join('')}</select><strong>${esc(it)}</strong></div>`).join('')}`}
 const ph=q.inputHint||'Antwort mit Einheit, z. B. 14 kg oder 24 m^2';
 return `${media}<input id="answerInput" class="input search" type="text" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="${esc(ph)}" value="${esc(val)}"><p class="small" style="margin-top:8px">Tipp: Auf dem Handy kannst du Einheiten normal eintippen. m² geht auch als m^2, m³ als m^3.</p>`}

function collect(q){if(q.type==='choice'){const el=document.querySelector('input[name="ans"]:checked');return el?Number(el.value):null}if(q.type==='multi')return [...document.querySelectorAll('input[name="ans"]:checked')].map(x=>Number(x.value));if(q.type==='order')return [...document.querySelectorAll('[data-order]')].map(x=>Number(x.value));if(q.type==='graphSlider')return {m:Number(document.getElementById('mSlider')?.value),b:Number(document.getElementById('bSlider')?.value)};return document.getElementById('answerInput')?.value.trim()??''}

function sliderGraphData(q,m,b){
 const base=q&&q.graph?q.graph:{};
 const xMin=Number.isFinite(Number(base.xMin))?Number(base.xMin):-5;
 const xMax=Number.isFinite(Number(base.xMax))?Number(base.xMax):5;
 let yMin=Number.isFinite(Number(base.yMin))?Number(base.yMin):-5;
 let yMax=Number.isFinite(Number(base.yMax))?Number(base.yMax):7;
 const yAtMin=m*xMin+b, yAtMax=m*xMax+b;
 const ys=[yAtMin,yAtMax,...((base.points||[]).map(p=>Number(p.y)).filter(Number.isFinite)),yMin,yMax];
 yMin=Math.floor(Math.min(...ys)-2);yMax=Math.ceil(Math.max(...ys)+2);
 if(yMax-yMin<8){yMax+=4;yMin-=4}
 return {title:'Deine Gerade: y = '+fmt(m)+'x '+(b>=0?'+ ':'− ')+fmt(Math.abs(b)),xMin,xMax,yMin,yMax,lines:[{m,b,label:'deine Gerade'}],points:base.points&&base.points.length?base.points:[{x:0,y:b,label:'b'}],tri:{x:0,y:b,dx:2,dy:2*m},caption:base.caption||'Stelle m und b so ein, dass die Gerade zur Aufgabe passt.'}
}
function updateSliderGraph(){
 try{
  const mEl=document.getElementById('mSlider');const bEl=document.getElementById('bSlider');const wrap=document.getElementById('sliderGraphWrap');
  if(!mEl||!bEl||!wrap||mEl.disabled||bEl.disabled)return;
  const m=Number(mEl.value)||0;const b=Number(bEl.value)||0;
  const mVal=document.getElementById('mVal');const bVal=document.getElementById('bVal');
  if(mVal)mVal.textContent=fmt(m);if(bVal)bVal.textContent=fmt(b);
  const q=typeof currentQ==='function'?currentQ():null;
  wrap.innerHTML=graphSVG(sliderGraphData(q,m,b));
 }catch(err){console.warn('Regler konnte den Graphen nicht aktualisieren:',err)}
}

function nextIntegrated(){const q=currentQ();if(!q)return repairBrokenQuiz();const saved=activeQuiz.answers[q.id];if(saved?.checked){if(activeQuiz.index>=activeQuiz.ids.length-1)return finishQuiz();activeQuiz.index++;state.currentQuiz=activeQuiz;saveState();renderQuiz();return}const val=collect(q);if(val===null||val===''||(Array.isArray(val)&&val.length===0)){alert('Bitte erst eine Antwort eingeben oder auswählen.');return}const result=evaluate(q,val);activeQuiz.answers[q.id]={value:val,checked:true,correct:result.correct,warning:!!result.warning,warningText:result.warningText||'',normalized:result.normalized,at:Date.now()};document.getElementById('feedbackBox').innerHTML=feedbackHTML(q,activeQuiz.answers[q.id]);document.getElementById('nextBtn').textContent=activeQuiz.index===activeQuiz.ids.length-1?'Ergebnis anzeigen':'Weiter →';state.currentQuiz=activeQuiz;saveState()}
function showTip(){document.getElementById('tipBox').innerHTML=`<div class="tip"><strong>💡 Tipp ohne Lösung:</strong><br>${esc(currentQ().hint)}</div>`}
function prevQ(){if(activeQuiz.index>0){activeQuiz.index--;state.currentQuiz=activeQuiz;saveState();renderQuiz()}}
function jumpQ(i){activeQuiz.index=Math.min(Math.max(Number(i)||0,0),activeQuiz.ids.length-1);state.currentQuiz=activeQuiz;saveState();renderQuiz()}
function norm(s){return String(s??'').toLowerCase().replace(/\s+/g,'').replace(/,/g,'.').replace(/−/g,'-').replace(/[·*]/g,'').replace(/€/g,'eur').replace(/²/g,'2').replace(/³/g,'3')}
function parseNumber(s){s=String(s).replace(/,/g,'.');const frac=s.match(/(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)/);if(frac)return Number(frac[1])/Number(frac[2]);const m=s.match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):NaN}
function hasUnit(raw,unit){if(!unit)return true;const s=String(raw).toLowerCase().replace(/\s/g,'').replace(/²/g,'2').replace(/³/g,'3').replace(/€/g,'eur');const map={'cm':['cm'],'mm':['mm'],'m':['m'],'kg':['kg'],'g':['g'],'€':['eur','€','euro'],'tage':['tag','tage','t'],'tag':['tag','tage'],'kw':['kw','kalenderwoche'],'mitarbeiter':['mitarbeiter','personen','arbeiter'],'pakete':['paket','pakete'],'liter':['liter','l'],'m²':['m2','m^2','qm','quadratmeter'],'m³':['m3','m^3','kubikmeter'],'h':['h','std','stunde','stunden'],'°':['°','grad'],'°f':['°f','f'],'cm³':['cm3','cm^3'],'cm²':['cm2','cm^2'],'prozentpunkte':['prozentpunkte','prozentpunkt','pp'],'%':['%','prozent'],'min':['min','minute','minuten'],'s':['s','sekunde','sekunden']};return (map[String(unit).toLowerCase()]||[String(unit).toLowerCase()]).some(a=>s.includes(a))}

function sameArray(a,b){return a.length===b.length&&a.every((x,i)=>Number(x)===Number(b[i]))}
function sameSet(a,b){return sameArray([...a].sort((x,y)=>x-y),[...b].sort((x,y)=>x-y))}
function mathTextNorm(s){return norm(s).replace(/function/g,'').replace(/kosten/g,'').replace(/€/g,'eur').replace(/\./g,'')}
function roundTo(n,d){const f=Math.pow(10,d);return Math.round(Number(n)*f)/f}
function numericMatches(q,num){if(Number.isNaN(num))return false;const ans=Number(q.answer);const wantsRound2=q.round===2||/2\s*nachkommastellen|auf\s*2\s*nachkommastellen/i.test(q.prompt||'');const wantsRound1=q.round===1||/1\s*nachkommastelle|auf\s*1\s*nachkommastelle/i.test(q.prompt||'');if(wantsRound2)return Math.abs(roundTo(num,2)-ans)<=0.0051;if(wantsRound1)return Math.abs(roundTo(num,1)-ans)<=0.051;const tol=typeof q.tolerance==='number'?q.tolerance:0.0001;return Math.abs(num-ans)<=tol}
function evaluate(q,val){
 if(q.type==='choice')return {correct:Number(val)===Number(q.answer),normalized:val};
 if(q.type==='multi')return {correct:sameSet(val,q.answer),normalized:val};
 if(q.type==='order'){const ordered=q.items.map((item,i)=>({item,rank:val[i]})).sort((a,b)=>a.rank-b.rank).map(x=>Number(x.item));return {correct:sameArray(ordered,q.answer),normalized:ordered.join(', ')}}
 if(q.type==='graphSlider')return {correct:Math.abs(Number(val.m)-Number(q.answer.m))<0.001&&Math.abs(Number(val.b)-Number(q.answer.b))<0.001,normalized:`m=${fmt(val.m)}, b=${fmt(val.b)}`};
 if(q.numeric){const num=parseNumber(val);const okNum=numericMatches(q,num);const okUnit=q.mustUnit?hasUnit(val,q.unit):true;if(okNum&&q.mustUnit&&!okUnit){return {correct:true,warning:true,warningText:`Die Zahl stimmt, aber die Einheit fehlt. In einer Arbeit ist die Einheit wichtig, weil z. B. 12, 12 m² und 12 Mitarbeiter völlig unterschiedliche Antworten sind. Schreib die Einheit direkt hinter das Ergebnis.`,normalized:num}}return {correct:okNum&&okUnit,normalized:num}}
 if(q.textAnswers){const user=mathTextNorm(val);return {correct:q.textAnswers.some(a=>mathTextNorm(a)===user),normalized:user}}
 return {correct:false,normalized:val}
}

function answerText(q){if(q.type==='choice')return q.options[q.answer];if(q.type==='multi')return q.answer.map(i=>q.options[i]).join('; ');if(q.type==='order')return q.answer.join(', ');if(q.type==='graphSlider')return `m=${fmt(q.answer.m)}, b=${fmt(q.answer.b)}`;if(q.textAnswers)return q.textAnswers[0];return `${String(q.answer).replace('.',',')}${q.unit?' '+q.unit:''}`}
function userText(q,a){if(!a)return '–';if(q.type==='choice')return q.options[a.value]||'–';if(q.type==='multi')return (a.value||[]).map(i=>q.options[i]).join('; ')||'–';if(q.type==='order')return a.normalized||'–';if(q.type==='graphSlider')return `m=${fmt(a.value?.m)}, b=${fmt(a.value?.b)}`;return a.value}
function feedbackHTML(q,a){const cls=a.warning?'warn':(a.correct?'good':'bad');const title=a.warning?'⚠️ Zahl stimmt, aber Einheit fehlt':(a.correct?'✅ Richtig':'❌ Noch nicht richtig');return `<div class="feedback ${cls}"><h3>${title}</h3><p><strong>Deine Antwort:</strong> ${esc(userText(q,a))}</p>${(!a.correct||a.warning)?`<p><strong>Richtige Lösung:</strong> ${esc(answerText(q))}</p>`:''}${a.warning?`<p><strong>Hinweis:</strong> ${esc(a.warningText||'Die Einheit fehlt. In einer Klassenarbeit kann das Punkte kosten, weil die Antwort sonst nicht eindeutig ist.')}</p>`:''}<p><strong>Erklärung:</strong> ${esc(q.explanation)}</p></div>`}
function finishQuiz(){activeQuiz.finished=true;const correct=activeQuiz.ids.filter(id=>activeQuiz.answers[id]?.correct).length;const total=activeQuiz.ids.length;const percent=Math.round(correct/total*100);const done={...activeQuiz,score:correct,total,percent,finishedAt:Date.now()};state.history.unshift(done);state.history=state.history.slice(0,40);state.currentQuiz=null;saveState();activeQuiz=done;renderResults(done)}
function renderResults(qz){const correct=qz.score??qz.ids.filter(id=>qz.answers[id]?.correct).length;const total=qz.total??qz.ids.length;const percent=qz.percent??Math.round(correct/total*100);const wrongIds=qz.ids.filter(id=>!qz.answers[id]?.correct);const warnCount=qz.ids.filter(id=>qz.answers[id]?.warning).length;app.innerHTML=`<section class="card"><p class="eyebrow">Auswertung</p><h1>${correct} / ${total} richtig</h1><div class="statGrid"><div class="stat"><strong>${percent}%</strong><span>Trefferquote</span></div><div class="stat"><strong>${total-correct}</strong><span>Fehler</span></div><div class="stat"><strong>${warnCount}</strong><span>Einheit-Warnungen</span></div><div class="stat"><strong>${total}</strong><span>Fragen</span></div></div><p class="lead">Hier stehen alle Lösungen mit Erklärung. Du kannst die Seite über den Browser drucken oder als PDF speichern.</p><div class="row noPrint"><button class="btn secondary" onclick="window.print()">🖨️ Drucken / PDF</button>${wrongIds.length?`<button class="btn primary" onclick='startQuiz({spec:{basics:"mix"},mode:"practice",count:"all",customIds:${JSON.stringify(wrongIds)},title:"Fehler wiederholen"})'>Fehler wiederholen</button>`:''}<button class="btn secondary" onclick="renderSetup()">Neues Quiz</button><button class="btn secondary" onclick="renderHome()">Start</button></div></section><div class="spacer"></div><section class="resultList">${qz.ids.map((id,i)=>{const q=QUESTIONS.find(x=>x.id===id);const a=qz.answers[id];if(!q)return `<article class="result wrong"><span class="tag">${i+1}. Alte Aufgabe</span><h3>Diese Aufgabe stammt aus einer älteren Version und wurde übersprungen.</h3></article>`;return `<article class="result ${a?.warning?'warning':(a?.correct?'correct':'wrong')}"><span class="tag">${i+1}. ${course(q.course).title} · ${DIFFS[q.diff]}</span><h3>${esc(q.prompt)}</h3><p><strong>Deine Antwort:</strong> ${esc(userText(q,a))}</p><p><strong>Richtige Lösung:</strong> ${esc(answerText(q))}</p>${a?.warning?`<p><strong>Einheit-Hinweis:</strong> ${esc(a.warningText||'Einheit ergänzen.')}</p>`:''}<p><strong>Erklärung:</strong> ${esc(q.explanation)}</p></article>`}).join('')}</section>`}
function renderProgress(){activeQuiz=null;const hist=state.history||[];const answered=hist.reduce((s,h)=>s+(h.total||h.ids?.length||0),0);const correct=hist.reduce((s,h)=>s+(h.score||0),0);const avg=answered?Math.round(correct/answered*100):0;app.innerHTML=`<section class="card"><p class="eyebrow">Fortschritt</p><h1>Gespeicherte Ergebnisse</h1><div class="statGrid"><div class="stat"><strong>${hist.length}</strong><span>Quizze</span></div><div class="stat"><strong>${answered}</strong><span>Fragen</span></div><div class="stat"><strong>${avg}%</strong><span>Durchschnitt</span></div></div><div class="row"><button class="btn primary" onclick="renderSetup()">Weiter üben</button><button class="btn danger" onclick="resetProgress()">Alles löschen</button></div></section><div class="spacer"></div><section class="resultList">${hist.length?hist.map((h,i)=>`<article class="result"><h3>${esc(h.title)}</h3><p><strong>${h.score}/${h.total}</strong> richtig (${h.percent}%).</p><p class="small">${new Date(h.finishedAt).toLocaleString('de-DE')}</p><button class="btn secondary" onclick="renderResults(state.history[${i}])">Lösungen ansehen</button></article>`).join(''):'<article class="card"><h2>Noch keine Ergebnisse</h2><p>Starte ein Quiz, dann wird hier gespeichert.</p></article>'}</section>`}
function resetProgress(){if(confirm('Wirklich Fortschritt und Speicherstand löschen?')){state={history:[],currentQuiz:null};saveState();renderProgress()}}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function graphSVG(g){const W=620,H=410,pad=52;const xMin=g.xMin??-5,xMax=g.xMax??5,yMin=g.yMin??-5,yMax=g.yMax??5;const sx=x=>pad+(x-xMin)/(xMax-xMin)*(W-2*pad);const sy=y=>H-pad-(y-yMin)/(yMax-yMin)*(H-2*pad);let out=`<svg class="graphSvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(g.title||'Graph')}"><defs><linearGradient id="gridFade" x1="0" x2="1"><stop offset="0" stop-color="var(--primary)"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><text x="${W/2}" y="26" text-anchor="middle" font-size="17" font-weight="900" fill="var(--text)">${esc(g.title||'Graph')}</text>`;const xStep=niceStep(xMin,xMax),yStep=niceStep(yMin,yMax);for(let x=Math.ceil(xMin/xStep)*xStep;x<=xMax+1e-9;x+=xStep){const X=sx(x);out+=`<line x1="${X}" y1="${pad}" x2="${X}" y2="${H-pad}" stroke="var(--line)"/><text x="${X}" y="${H-pad+22}" text-anchor="middle" font-size="12" fill="var(--muted)">${Math.abs(x)<1e-9?'':fmt(x)}</text>`}for(let y=Math.ceil(yMin/yStep)*yStep;y<=yMax+1e-9;y+=yStep){const Y=sy(y);out+=`<line x1="${pad}" y1="${Y}" x2="${W-pad}" y2="${Y}" stroke="var(--line)"/><text x="${pad-10}" y="${Y+4}" text-anchor="end" font-size="12" fill="var(--muted)">${Math.abs(y)<1e-9?'':fmt(y)}</text>`}if(xMin<=0&&xMax>=0)out+=`<line x1="${sx(0)}" y1="${pad}" x2="${sx(0)}" y2="${H-pad}" stroke="var(--muted)" stroke-width="2.2"/><text x="${sx(0)+10}" y="${pad+14}" font-size="13" fill="var(--muted)">y</text>`;if(yMin<=0&&yMax>=0)out+=`<line x1="${pad}" y1="${sy(0)}" x2="${W-pad}" y2="${sy(0)}" stroke="var(--muted)" stroke-width="2.2"/><text x="${W-pad-14}" y="${sy(0)-8}" font-size="13" fill="var(--muted)">x</text>`;(g.lines||[]).forEach((ln,i)=>{const col=['url(#gridFade)','var(--accent)','var(--good)','#38bdf8'][i%4];const x1=xMin,x2=xMax,y1=ln.m*x1+ln.b,y2=ln.m*x2+ln.b;out+=`<line x1="${sx(x1)}" y1="${sy(y1)}" x2="${sx(x2)}" y2="${sy(y2)}" stroke="${col}" stroke-width="4" stroke-linecap="round"/><text x="${Math.min(W-pad-45,Math.max(pad+8,sx(xMax)-42))}" y="${Math.min(H-pad-8,Math.max(pad+16,sy(y2)-8))}" fill="${i===0?'var(--primary)':col}" font-weight="900">${esc(ln.label||'')}</text>`});(g.parabolas||[]).forEach((pa,i)=>{let d='';const steps=100;for(let k=0;k<=steps;k++){const x=xMin+(xMax-xMin)*k/steps;const y=pa.a*x*x+pa.b*x+pa.c;d+=(k?'L':'M')+sx(x)+' '+sy(y)+' '}const col=['url(#gridFade)','var(--accent)','var(--good)','#38bdf8'][i%4];out+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"/><text x="${Math.min(W-pad-45,Math.max(pad+8,sx(xMax)-42))}" y="${pad+28+i*18}" fill="var(--primary)" font-weight="900">${esc(pa.label||'')}</text>`});if(g.tri){const t=g.tri;out+=`<path d="M${sx(t.x)} ${sy(t.y)} L${sx(t.x+t.dx)} ${sy(t.y)} L${sx(t.x+t.dx)} ${sy(t.y+t.dy)}" fill="none" stroke="var(--bad)" stroke-width="3" stroke-dasharray="7 5"/><text x="${(sx(t.x)+sx(t.x+t.dx))/2}" y="${sy(t.y)+18}" font-size="13" fill="var(--bad)" font-weight="900">Δx=${fmt(t.dx)}</text><text x="${sx(t.x+t.dx)+7}" y="${(sy(t.y)+sy(t.y+t.dy))/2}" font-size="13" fill="var(--bad)" font-weight="900">Δy=${fmt(t.dy)}</text>`}(g.points||[]).forEach(pt=>{out+=`<g><circle cx="${sx(pt.x)}" cy="${sy(pt.y)}" r="6" fill="var(--bad)"/><circle cx="${sx(pt.x)}" cy="${sy(pt.y)}" r="12" fill="var(--bad)" opacity=".13"/><text x="${sx(pt.x)+9}" y="${sy(pt.y)-9}" fill="var(--text)" font-size="13" font-weight="900">${esc(pt.label||`(${pt.x}|${pt.y})`)}</text></g>`});out+='</svg>';return out}
function niceStep(min,max){const span=Math.abs(max-min);if(span<=10)return 1;if(span<=25)return 5;if(span<=80)return 10;if(span<=200)return 20;if(span<=1000)return 100;if(span<=10000)return 1000;if(span<=100000)return 10000;return 100000}
function chartSVG(c){const W=620,H=380,pad=58;const vals=c.values||[];const yMin=c.yMin??0,yMax=c.yMax??Math.max(...vals.map(v=>v.value),10);const innerW=W-2*pad,innerH=H-2*pad;const bw=innerW/Math.max(vals.length,1)*0.56;const sy=y=>H-pad-(y-yMin)/(yMax-yMin)*innerH;let out=`<svg class="chartSvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||'Diagramm')}"><text x="${W/2}" y="27" text-anchor="middle" font-size="17" font-weight="900" fill="var(--text)">${esc(c.title||'Diagramm')}</text>`;const step=niceStep(yMin,yMax);for(let y=Math.ceil(yMin/step)*step;y<=yMax+1e-9;y+=step){const Y=sy(y);out+=`<line x1="${pad}" y1="${Y}" x2="${W-pad}" y2="${Y}" stroke="var(--line)"/><text x="${pad-10}" y="${Y+4}" text-anchor="end" font-size="12" fill="var(--muted)">${fmt(y)}${esc(c.unit??"%")}</text>`}out+=`<line x1="${pad}" y1="${sy(yMin)}" x2="${W-pad}" y2="${sy(yMin)}" stroke="var(--muted)" stroke-width="2"/>`;vals.forEach((v,i)=>{const x=pad+(i+.5)*innerW/vals.length-bw/2;const y=sy(v.value);const base=sy(yMin);out+=`<rect x="${x}" y="${y}" width="${bw}" height="${base-y}" rx="12" fill="var(--primary)" opacity=".9"/><text x="${x+bw/2}" y="${y-8}" text-anchor="middle" font-size="14" font-weight="900" fill="var(--text)">${fmt(v.value)}${esc(c.unit??"%")}</text><text x="${x+bw/2}" y="${H-pad+25}" text-anchor="middle" font-size="14" fill="var(--text)">${esc(v.label)}</text>`});out+='</svg>';return out}

}

function renderExamMode(){
 activeQuiz=null;
 const n=(part,year)=>QUESTIONS.filter(q=>q.examPart===part&&(year==='all'||q.examYear===Number(year))).length;
 app.innerHTML=`<section class="card"><p class="eyebrow">Abschlussarbeitsmodus v10.1</p><h1>Prüfungsnah üben wie 2024/2025</h1><p class="lead">Hier kannst du wie in den echten Abschlussarbeiten getrennt üben: <strong>Teil 1 ohne Hilfsmittel</strong> und <strong>Teil 2 mit Hilfsmitteln</strong>. Im Prüfungsmodus gibt es keine Tipps während der Aufgabe, sondern die Erklärung am Ende.</p><div class="quickHelp"><div class="quickCard"><strong>Teil 1</strong>Grundlagen, Einheiten, Prozent, Terme, einfache Geometrie.</div><div class="quickCard"><strong>Teil 2</strong>Diagramme, Funktionen, Körper, Wahrscheinlichkeit, Trigonometrie.</div><div class="quickCard"><strong>Originalähnlich</strong>Mit Skizzen, Graphen, Diagrammen und Rechenweg-Training.</div></div></section><div class="spacer"></div><section class="courseGrid">
 <article class="courseCard"><div class="courseIcon">🧾</div><h3>Teil 1 – 2024/2025 gemischt</h3><p>Ohne Hilfsmittel: schnelle Grundlagen und saubere Einheiten.</p><div class="courseStats"><span class="tag">${n('teil1','all')} Aufgaben</span><span class="tag">ohne Tipps</span></div><button class="btn primary" onclick="startExamPreset('teil1','all')">Teil 1 starten</button></article>
 <article class="courseCard"><div class="courseIcon">📐</div><h3>Teil 2 – 2024/2025 gemischt</h3><p>Mit Hilfsmitteln: größere Aufgaben mit Skizzen, Diagrammen und Funktionen.</p><div class="courseStats"><span class="tag">${n('teil2','all')} Aufgaben</span><span class="tag">ohne Tipps</span></div><button class="btn primary" onclick="startExamPreset('teil2','all')">Teil 2 starten</button></article>
 <article class="courseCard"><div class="courseIcon">📝</div><h3>Mini-Abschlussarbeit</h3><p>Gemischt aus Teil 1 und Teil 2, ähnlich wie ein kurzer Prüfungslauf.</p><div class="courseStats"><span class="tag">24 Aufgaben</span><span class="tag">Prüfungsmodus</span></div><button class="btn primary" onclick="startExamFull()">Mini-Prüfung starten</button></article>
 <article class="courseCard"><div class="courseIcon">2024</div><h3>Nur 2024</h3><p>Aufgaben nach dem Muster der Abschlussarbeit 2024.</p><div class="courseStats"><span class="tag">${n('teil1',2024)+n('teil2',2024)} Aufgaben</span></div><button class="btn secondary" onclick="startExamYear(2024)">2024 starten</button></article>
 <article class="courseCard"><div class="courseIcon">2025</div><h3>Nur 2025</h3><p>Aufgaben nach dem Muster der Abschlussarbeit 2025.</p><div class="courseStats"><span class="tag">${n('teil1',2025)+n('teil2',2025)} Aufgaben</span></div><button class="btn secondary" onclick="startExamYear(2025)">2025 starten</button></article>
 </section>`;
}
function startExamPreset(part,year){
 const pool=QUESTIONS.filter(q=>q.examPart===part&&(year==='all'||q.examYear===Number(year)));
 const ids=shuffle(pool.map(q=>q.id)).slice(0,part==='teil1'?12:14);
 startQuiz({spec:{},mode:'exam',count:'all',customIds:ids,title:`Abschlussarbeitsmodus ${year==='all'?'2024/2025':year} · ${part==='teil1'?'Teil 1':'Teil 2'}`});
}
function startExamYear(year){
 const pool=QUESTIONS.filter(q=>q.examYear===Number(year)&&q.examPart);
 const ids=shuffle(pool.map(q=>q.id)).slice(0,20);
 startQuiz({spec:{},mode:'exam',count:'all',customIds:ids,title:`Abschlussarbeitsmodus ${year}`});
}
function startExamFull(){
 const part1=shuffle(QUESTIONS.filter(q=>q.examPart==='teil1').map(q=>q.id)).slice(0,10);
 const part2=shuffle(QUESTIONS.filter(q=>q.examPart==='teil2').map(q=>q.id)).slice(0,14);
 startQuiz({spec:{},mode:'exam',count:'all',customIds:[...part1,...part2],title:'Mini-Abschlussarbeit 2024/2025'});
}

const NOTES_KEY='matheCoachV10_2GlobalNotes';
let calcExpression='';
function injectToolStyles(){
 if(document.getElementById('toolStyle'))return;
 const style=document.createElement('style');
 style.id='toolStyle';
 style.textContent=`
 .floatToolBtn{position:fixed;z-index:1200;width:58px;height:58px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(180deg,var(--card),var(--soft));color:var(--text);box-shadow:0 18px 45px rgba(0,0,0,.20);font-weight:950;font-size:24px;display:grid;place-items:center}
 .floatToolBtn:hover{transform:translateY(-2px)}
 #notesFloatBtn{left:16px;bottom:16px} #calcFloatBtn{right:130px;bottom:16px}
 #calcFloatBtn.blocked{opacity:.55;filter:grayscale(.35);border-color:var(--warn)}
 .toolPanel{position:fixed;z-index:1250;bottom:86px;width:min(92vw,390px);background:linear-gradient(180deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:26px;box-shadow:0 24px 70px rgba(0,0,0,.28);padding:16px;display:none}
 .toolPanel.open{display:block}.notesPanel{left:16px}.calcPanel{right:16px;width:min(92vw,340px)}
 .toolHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.toolHead h3{margin:0;font-size:20px}.miniX{border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:13px;min-width:40px;height:40px;font-weight:950}
 .notesText{width:100%;min-height:260px;max-height:52vh;resize:vertical;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);padding:14px;font-size:16px;line-height:1.45}
 .calcDisplay{width:100%;min-height:58px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--text);font-family:var(--mono);font-size:22px;padding:14px;text-align:right;margin-bottom:10px;overflow:auto}
 .calcGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.calcKey{border:1px solid var(--line);border-radius:15px;background:var(--soft);color:var(--text);min-height:48px;font-weight:950;font-size:18px}.calcKey.op{background:var(--soft2)}.calcKey.eq{background:var(--primary);color:white}.calcMsg{font-size:13px;color:var(--muted);margin-top:10px}.blockedMsg{background:rgba(154,100,0,.14);border:1px solid var(--warn);border-radius:16px;padding:12px;color:var(--text);font-size:15px;margin-bottom:10px}
 @media(max-width:760px){.formulaFab{padding:12px 14px;font-size:0}.formulaFab::after{content:'📐';font-size:22px}.floatToolBtn{width:50px;height:50px;border-radius:18px;font-size:21px}.toolPanel{bottom:76px}.notesPanel,.calcPanel{left:10px;right:10px;width:auto}.notesText{min-height:220px}.calcGrid{gap:7px}.calcKey{min-height:46px}.quizSide .btn{width:100%}#calcFloatBtn{right:132px;bottom:12px}}
 @media print{.floatToolBtn,.toolPanel{display:none!important}}
 `;
 document.head.appendChild(style);
}
function initFloatingTools(){
 injectToolStyles();
 if(document.getElementById('notesFloatBtn'))return;
 const noteBtn=document.createElement('button');noteBtn.id='notesFloatBtn';noteBtn.className='floatToolBtn noPrint';noteBtn.title='Notizen öffnen';noteBtn.textContent='📝';noteBtn.onclick=()=>toggleNotes();
 const calcBtn=document.createElement('button');calcBtn.id='calcFloatBtn';calcBtn.className='floatToolBtn noPrint';calcBtn.title='Taschenrechner öffnen';calcBtn.textContent='🧮';calcBtn.onclick=()=>toggleCalculator();
 const notes=document.createElement('section');notes.id='notesPanel';notes.className='toolPanel notesPanel noPrint';notes.innerHTML=`<div class="toolHead"><h3>📝 Notizen</h3><button class="miniX" onclick="toggleNotes(false)">×</button></div><textarea id="globalNotes" class="notesText" placeholder="Hier kannst du dir Rechenwege, Formeln oder Fragen merken … wird automatisch gespeichert."></textarea><p class="calcMsg">Speichert automatisch in diesem Browser.</p>`;
 const calc=document.createElement('section');calc.id='calcPanel';calc.className='toolPanel calcPanel noPrint';calc.innerHTML=`<div class="toolHead"><h3>🧮 Taschenrechner</h3><button class="miniX" onclick="toggleCalculator(false)">×</button></div><div id="calcBlockMsg"></div><div id="calcDisplay" class="calcDisplay">0</div><div class="calcGrid">${['C','⌫','(',')','7','8','9','÷','4','5','6','×','1','2','3','−','0',',','π','+','√','x²','^','='].map(k=>`<button class="calcKey ${['÷','×','−','+','√','x²','^','='].includes(k)?'op':''} ${k==='='?'eq':''}" onclick="calcPress('${k}')">${k}</button>`).join('')}</div><p class="calcMsg">Tipp: Für Prüfungsmodus Teil 1 und einfache Kopfrechenaufgaben wird der Rechner gesperrt.</p>`;
 document.body.append(noteBtn,calcBtn,notes,calc);
 const ta=document.getElementById('globalNotes');ta.value=localStorage.getItem(NOTES_KEY)||'';ta.addEventListener('input',()=>localStorage.setItem(NOTES_KEY,ta.value));
 updateCalcDisplay();updateToolAvailability();setInterval(updateToolAvailability,750);
}
function toggleNotes(force){const p=document.getElementById('notesPanel');if(!p)return;const open=typeof force==='boolean'?force:!p.classList.contains('open');p.classList.toggle('open',open);if(open)setTimeout(()=>document.getElementById('globalNotes')?.focus(),50)}
function needsHeadCalculatorBlock(q){
 if(!q)return false;
 if(q.noCalculator || q.examPart==='teil1')return true;
 const p=String(q.prompt||'').toLowerCase();
 const simple=/berechne:\s*[-0-9]|ergänze|lücke|term|gleichung|kopfrechnen|ohne hilfsmittel/.test(p);
 return Boolean(activeQuiz && activeQuiz.mode==='exam' && q.diff==='hard' && q.headCalc && simple);
}
function calcAllowedInfo(){const q=currentQ&&currentQ();if(needsHeadCalculatorBlock(q)){return {allowed:false,reason:q?.examPart==='teil1'?'Teil 1 ist wie in der echten Abschlussarbeit ohne Taschenrechner.':'Diese Aufgabe ist als Kopfrechen-/Rechenweg-Aufgabe markiert. Übe sie ohne Taschenrechner, damit du es in der Arbeit sicher kannst.'}}return {allowed:true,reason:'Taschenrechner erlaubt.'}}
function updateToolAvailability(){const btn=document.getElementById('calcFloatBtn');const msg=document.getElementById('calcBlockMsg');const inline=document.getElementById('calcStatusInline');if(!btn)return;const info=calcAllowedInfo();btn.classList.toggle('blocked',!info.allowed);btn.title=info.allowed?'Taschenrechner öffnen':'Taschenrechner gesperrt: '+info.reason;if(msg)msg.innerHTML=info.allowed?'':`<div class="blockedMsg"><strong>Gesperrt:</strong> ${esc(info.reason)}</div>`;if(inline)inline.textContent=info.allowed?'🧮 Taschenrechner: erlaubt':'🧮 Taschenrechner: gesperrt – '+info.reason;}
function toggleCalculator(force){const p=document.getElementById('calcPanel');if(!p)return;updateToolAvailability();const open=typeof force==='boolean'?force:!p.classList.contains('open');p.classList.toggle('open',open)}
function calcPress(k){const info=calcAllowedInfo();if(!info.allowed){updateToolAvailability();toggleCalculator(true);return}if(k==='C'){calcExpression='';return updateCalcDisplay()}if(k==='⌫'){calcExpression=calcExpression.slice(0,-1);return updateCalcDisplay()}if(k==='=')return calcEvaluate();if(k==='÷')calcExpression+='/';else if(k==='×')calcExpression+='*';else if(k==='−')calcExpression+='-';else if(k===',')calcExpression+='.';else if(k==='π')calcExpression+='π';else if(k==='√')calcExpression+='√(';else if(k==='x²')calcExpression+='^2';else calcExpression+=k;updateCalcDisplay()}
function updateCalcDisplay(value){const d=document.getElementById('calcDisplay');if(!d)return;d.textContent=value??(calcExpression||'0')}
function calcEvaluate(){try{const result=safeCalc(calcExpression);calcExpression=String(Math.round(result*100000000)/100000000).replace('.',',');updateCalcDisplay(calcExpression)}catch(e){updateCalcDisplay('Fehler')}}
function safeCalc(expr){let e=String(expr).replace(/,/g,'.').replace(/π|pi/gi,'(Math.PI)').replace(/√\s*\(/g,'Math.sqrt(').replace(/:/g,'/').replace(/[×·]/g,'*').replace(/−/g,'-').replace(/\^/g,'**');if(!/^[0-9+\-*/().\sMathPIsqrt]+$/.test(e))throw new Error('bad');const val=Function('Math',`"use strict";return (${e})`)(Math);if(!Number.isFinite(val))throw new Error('bad');return val}
document.getElementById('brandBtn').addEventListener('click',renderHome);document.querySelectorAll('[data-screen]').forEach(btn=>btn.addEventListener('click',()=>{const s=btn.dataset.screen;if(s==='home')renderHome();if(s==='learn')renderLearn();if(s==='setup')renderSetup();if(s==='progress')renderProgress();if(s==='videos')renderVideos();if(s==='exam')renderExamMode()}));document.getElementById('themeBtn').addEventListener('click',()=>setTheme(document.body.classList.contains('dark')?'light':'dark'));document.getElementById('formulaToggle').addEventListener('click',()=>toggleFormula());document.getElementById('formulaClose').addEventListener('click',()=>toggleFormula(false));document.getElementById('formulaBackdrop').addEventListener('click',()=>toggleFormula(false));renderFormulaPanel();setTheme(localStorage.getItem(THEME_KEY)||'light');renderHome();initFloatingTools();
