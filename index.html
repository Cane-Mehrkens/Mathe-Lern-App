 {course:'dreisatz',title:'Dreisatz antiproportional',terms:['antiproportional','Arbeiter','Zeit','Produkt'],formula:'Anzahl · Zeit = gleichbleibendes Produkt',text:'Antiproportional bedeutet: mehr Arbeiter brauchen weniger Zeit. Typisch sind Aufgaben mit Arbeitern, Maschinen oder Geschwindigkeit.',steps:['Bekannte Anzahl mal bekannte Zeit rechnen.','Dieses Produkt durch die neue Anzahl teilen.','Antwortsatz mit Tagen, Stunden usw. schreiben.'],example:'4 Arbeiter brauchen 15 Tage. Produkt 4·15=60. 12 Arbeiter brauchen 60:12=5 Tage.',mistake:'Mehr Arbeiter darf nicht mehr Tage ergeben. Prüfe, ob das Ergebnis logisch ist.'},
 {course:'geo',title:'Rechteckfläche mit a·b',terms:['a·b','Rechteck','Fläche','m²'],formula:'A = a · b',text:'Bei einem Rechteck multiplizierst du Länge und Breite. Die Einheit der Fläche ist m².',steps:['Länge a und Breite b finden.','A=a·b aufschreiben.','Einsetzen und multiplizieren.','Antwort mit m² schreiben.'],example:'a=9 m, b=4 m → A=9·4=36 m².',mistake:'Bei Fläche nicht m schreiben, sondern m².'},
 {course:'geo',title:'Volumen von Quader und Zylinder',terms:['Volumen','Quader','Zylinder','m³'],formula:'Quader: V=a·b·h | Zylinder: V=π·r²·h',text:'Volumen beschreibt den Raum im Körper. Beim Quader multiplizierst du drei Kanten. Beim Zylinder kommt zuerst die Kreisfläche.',steps:['Körper erkennen.','Passende Formel aufschreiben.','Werte einsetzen.','m³ dazuschreiben.'],example:'Quader: 5·4·2=40 m³. Zylinder: π·2²·5≈62,83 m³.',mistake:'Beim Zylinder erst r² rechnen, nicht 2·r.'},
 {course:'geo',title:'Hohlkörper als Differenz',terms:['Hohlkörper','Außenkörper','Innenkörper','Differenz'],formula:'VMaterial = Vaußen − Vinnen',text:'Ein Hohlkörper besteht aus Material außen, aber innen ist ein leerer Raum. Deshalb rechnet man außen minus innen.',steps:['Außenvolumen berechnen.','Innenvolumen berechnen.','Außen minus innen rechnen.','Einheit m³ angeben.'],example:'Außen 80 m³, innen 55 m³ → Materialvolumen 25 m³.',mistake:'Nicht außen und innen addieren.'},

 {course:'geo',title:'Geometrie-Formeln sauber aufschreiben',terms:['Formel','Rechenweg','Fläche','Umfang','Einsetzen'],formula:'Fläche: A = Formel = Zahlen einsetzen = Ergebnis | Umfang: U = Seiten addieren = Ergebnis',text:'Bei Geometrie soll der Rechenweg ordentlich aussehen. Schreibe erst die Formel hin, dann setzt du die Zahlen ein, dann kommt das Ergebnis mit Einheit.',steps:['Form erkennen: Rechteck, Dreieck, Trapez, Kreis usw.','Gesucht markieren: Fläche A, Umfang U, Volumen V oder Oberfläche O.','Formel genau hinschreiben.','Zahlen mit Einheiten einsetzen.','Ergebnis mit richtiger Einheit schreiben: Länge m, Fläche m², Volumen m³.'],example:'Dreieck mit a=6 m, h=4 m, Seiten 5 m, 5 m, 6 m: Fläche: A = a⋅h:2 = 6⋅4:2 = 12 m². Umfang: U = a+b+c = 6+5+5 = 16 m.',mistake:'Nicht nur die Endzahl hinschreiben. Dein Lehrer will sehen, welchen Rechenweg du benutzt hast.'},
 {course:'geo',title:'Umfang, Fläche und Volumen unterscheiden',terms:['Umfang','Fläche','Volumen','m','m²','m³'],formula:'Umfang U → außen herum → m | Fläche A → innen drin → m² | Volumen V → Körper/Raum → m³',text:'Viele Fehler entstehen, weil Fläche, Umfang und Volumen verwechselt werden. Frage dich immer: Geht es um eine Linie außen, eine Fläche oder einen Körper?',steps:['Umfang: Du läufst außen um die Form herum.','Fläche: Du füllst die Form innen aus.','Volumen: Du füllst einen Körper im Raum.','Einheit prüfen: m, m² oder m³.'],example:'Ein Gartenzaun um ein Rechteck ist Umfang. Rasenfläche im Rechteck ist Fläche. Wasser in einem Becken ist Volumen.',mistake:'Wenn du bei einer Fläche nur m schreibst, fehlt das Quadrat: richtig ist m².'},
 {course:'geo',title:'Quadrat, Rechteck und Parallelogramm',terms:['Quadrat','Rechteck','Parallelogramm','a·b','a·h'],formula:'Quadrat: A=a², U=4a | Rechteck: A=a⋅b, U=2a+2b | Parallelogramm: A=a⋅h, U=2a+2b',text:'Diese Formen sind oft die Grundlage. Beim Parallelogramm nimmst du nicht die schräge Seite als Höhe, sondern die senkrechte Höhe.',steps:['Form erkennen.','Für Fläche Grundseite mal passende Höhe/Breite rechnen.','Für Umfang alle Seiten außen addieren.','Bei Rechteck/Parallelogramm kannst du 2a+2b rechnen.'],example:'Parallelogramm: a=8 m, h=3 m, b=5 m → Fläche: A=a⋅h=8⋅3=24 m². Umfang: U=2a+2b=16+10=26 m.',mistake:'Beim Parallelogramm ist h nicht die schräge Seite b.'},
 {course:'geo',title:'Dreieck, Trapez, Raute und Drachen',terms:['Dreieck','Trapez','Raute','Drachen','Diagonalen'],formula:'Dreieck: A=a⋅h:2 | Trapez: A=(a+c)⋅h:2 | Raute/Drachen: A=e⋅f:2',text:'Bei Dreieck und Trapez wird durch 2 geteilt. Bei Raute und Drachen kannst du mit den Diagonalen e und f rechnen.',steps:['Dreieck: Grundseite und Höhe finden.','Trapez: die zwei parallelen Seiten a und c addieren.','Raute/Drachen: Diagonalen e und f benutzen, falls gegeben.','Umfang: alle Außenkanten addieren.'],example:'Trapez: a=10 m, c=6 m, h=4 m → A=(10+6)⋅4:2=32 m².',mistake:'Beim Trapez nicht nur eine Grundseite benutzen. Du brauchst a+c.'},
 {course:'geo',title:'Körper: Volumen und Oberfläche',terms:['Würfel','Quader','Prisma','Zylinder','Oberfläche'],formula:'Würfel V=a³, O=6a² | Quader V=a⋅b⋅h, O=2ab+2ah+2bh | Prisma V=G⋅h | Zylinder V=πr²h',text:'Beim Volumen geht es um den Inhalt eines Körpers. Oberfläche bedeutet: alle Außenflächen zusammen.',steps:['Körper erkennen.','Grundfläche G bestimmen.','Volumen meistens: Grundfläche mal Höhe.','Bei Oberfläche alle Außenflächen addieren oder passende Formel nutzen.'],example:'Quader: a=5 m, b=3 m, h=2 m → V=5⋅3⋅2=30 m³. O=2⋅5⋅3+2⋅5⋅2+2⋅3⋅2=62 m².',mistake:'Oberfläche hat m², Volumen hat m³.'},
 {course:'geo',title:'Formeln umstellen',terms:['umstellen','gesucht','geteilt','mal','Wurzel'],formula:'A=a⋅b → a=A:b | A=a⋅h:2 → h=2A:a | U=2a+2b → a=U:2−b',text:'Wenn nicht die Fläche gesucht ist, sondern eine Seite oder Höhe, musst du die Formel rückwärts benutzen. Das geht leichter, wenn du zuerst die Formel normal aufschreibst.',steps:['Formel normal aufschreiben.','Gesuchte Größe einkreisen.','Alles, was stört, auf die andere Seite bringen.','Gegenrechnung benutzen: mal ↔ geteilt, plus ↔ minus, Quadrat ↔ Wurzel.'],example:'Dreieck: A=20 m², a=10 m. A=a⋅h:2 → h=2A:a=2⋅20:10=4 m.',mistake:'Beim Dreieck beim Umstellen die 2 nicht vergessen.'},
 {course:'geo',title:'Zusammengesetzte Flächen',terms:['zusammengesetzt','Teilflächen','addieren','abziehen'],formula:'Agesamt = A₁ + A₂ + A₃ | Loch/Ausschnitt: Agesamt = Außenfläche − Innenfläche',text:'Manche Figuren bestehen aus mehreren bekannten Formen. Zerlege sie in Rechtecke, Dreiecke, Kreise oder Trapeze.',steps:['Figur in einfache Formen zerlegen.','Jede Teilfläche einzeln berechnen.','Teilflächen addieren.','Wenn etwas ausgeschnitten ist: abziehen.'],example:'Hausform: Rechteck 8⋅4=32 m² und Dreieck 8⋅3:2=12 m² → Gesamtfläche 44 m².',mistake:'Nicht alle Zahlen blind multiplizieren. Erst überlegen, welche Teilform gemeint ist.'},
 {course:'circlePyth',title:'Kreisrechnung: Radius, Durchmesser, Umfang, Fläche',terms:['Kreis','Radius','Durchmesser','Umfang','Fläche'],formula:'d=2r | U=2πr=πd | A=πr²',text:'Der Radius geht von der Mitte bis zum Rand. Der Durchmesser geht einmal ganz durch den Kreis und ist doppelt so groß.',steps:['Prüfen: Gegeben r oder d?','Falls d gegeben ist: r=d:2.','Für Umfang U=2πr oder πd.','Für Fläche A=πr².'],example:'r=4 cm → U≈25,13 cm und A≈50,27 cm².',mistake:'Für die Fläche wird r quadriert. Nicht den Durchmesser quadrieren, außer du hast vorher r gebildet.'},
 {course:'circlePyth',title:'Satz des Pythagoras',terms:['Pythagoras','rechtwinklig','Kathete','Hypotenuse'],formula:'a² + b² = c²',text:'Pythagoras gilt nur beim rechtwinkligen Dreieck. c ist die längste Seite gegenüber vom rechten Winkel.',steps:['Prüfen: Ist es rechtwinklig?','Hypotenuse c erkennen.','Wenn c gesucht ist: a²+b²=c².','Wenn eine Kathete gesucht ist: c²−andere Kathete².','Wurzel ziehen.'],example:'a=3, b=4 → c²=9+16=25 → c=5.',mistake:'Die längste Seite ist c. Nicht aus Versehen eine Kathete als c nehmen.'},
 {course:'stats',title:'Mittelwert berechnen',terms:['Mittelwert','Durchschnitt','arithmetisches Mittel'],formula:'Mittelwert = Summe aller Werte : Anzahl',text:'Der Mittelwert verteilt die Summe gleichmäßig auf alle Werte. Ausreißer können ihn stark verschieben.',steps:['Alle Werte addieren.','Anzahl der Werte zählen.','Summe durch Anzahl teilen.','Einheit übernehmen.'],example:'4, 6, 8 → Summe 18 → 18:3=6.',mistake:'Nicht durch den größten Wert teilen, sondern durch die Anzahl.'},
 {course:'stats',title:'Median berechnen',terms:['Median','Zentralwert','sortieren','Mitte'],formula:'ungerade: mittlerer Wert | gerade: Mittelwert der zwei mittleren Werte',text:'Der Median ist die Mitte einer sortierten Liste. Er ist oft gut, wenn es Ausreißer gibt.',steps:['Werte aufsteigend sortieren.','Mitte suchen.','Bei zwei mittleren Werten deren Durchschnitt rechnen.'],example:'2, 4, 6, 100 → mittlere Werte 4 und 6 → Median 5.',mistake:'Ohne Sortieren ist der Median oft falsch.'},
 {course:'stats',title:'Spannweite und Streuung',terms:['Spannweite','Streuung','größter','kleinster'],formula:'Spannweite = größter Wert − kleinster Wert',text:'Die Spannweite zeigt, wie stark Werte auseinanderliegen. Eine kleine Spannweite bedeutet eher gleichmäßige Ergebnisse.',steps:['Kleinsten Wert finden.','Größten Wert finden.','Größten minus kleinsten rechnen.','In einem Satz deuten.'],example:'10, 12, 18 → Spannweite 18−10=8.',mistake:'Spannweite ist nicht der Durchschnitt.'},
 {course:'fakeStats',title:'Statistiken beschreiben',terms:['Beschreibung','Diagramm','Auffälligkeit','Zahlenbeleg'],formula:'Thema + Richtung + Zahlenbeleg + Bedeutung',text:'Eine gute Beschreibung sagt nicht nur „viel“ oder „wenig“, sondern nennt konkrete Zahlen aus der Statistik.',steps:['Thema und Einheit nennen.','Höchsten oder niedrigsten Wert nennen.','Eine Entwicklung beschreiben.','Mit Zahlen belegen.','Kurz deuten, was es bedeutet.'],example:'„Der Ausschuss steigt von 2 % auf 5 %. Das sind +3 Prozentpunkte, also eine deutliche Verschlechterung.“',mistake:'Nicht nur schreiben: „Es ist gestiegen.“ Immer Zahlen dazu.'},
 {course:'fakeStats',title:'Fake-Statistik erkennen',terms:['Fake Statistik','y-Achse','Stichprobe','Cherry Picking','Korrelation'],formula:'Achse · Einheit · Zeitraum · Stichprobe · Ausreißer · Quelle prüfen',text:'Manche Diagramme lassen Unterschiede riesig wirken, obwohl sie klein sind. Besonders gefährlich ist eine abgeschnittene y-Achse.',steps:['Startet die y-Achse bei 0?','Sind Einheiten und Achsen beschriftet?','Ist der Zeitraum sinnvoll oder herausgepickt?','Ist die Stichprobe groß und passend?','Gibt es Ausreißer oder fehlende Daten?'],example:'95 % und 98 % sind nur 3 Prozentpunkte Unterschied. Wenn die Achse erst bei 90 startet, wirken sie optisch riesig.',mistake:'Nicht nur nach der Balkenhöhe gehen. Immer die Achse lesen.'},
 {course:'fakeStats',title:'Prozent vs. Prozentpunkte',terms:['Prozent','Prozentpunkte','relativ','absolut'],formula:'Prozentpunkte = neuer Prozentwert − alter Prozentwert',text:'Prozentpunkte sind der direkte Abstand zwischen zwei Prozentzahlen. Prozent beschreibt oft eine relative Veränderung.',steps:['Alten und neuen Prozentwert markieren.','Für Prozentpunkte direkt abziehen.','Für relative Veränderung durch den alten Wert teilen.'],example:'2 % auf 4 % = +2 Prozentpunkte, aber relativ +100 %, weil es sich verdoppelt.',mistake:'2 % auf 4 % ist nicht +100 Prozentpunkte.'},
 {course:'linBasic',title:'Lineare Funktion f(x)=m·x+b',terms:['lineare Funktion','m','b','Steigung'],formula:'f(x)=m·x+b',text:'m ist die Steigung. b ist der y-Achsenabschnitt, also der Wert bei x=0.',steps:['b an der y-Achse erkennen.','m mit Steigungsdreieck oder zwei Punkten berechnen.','In f(x)=m·x+b einsetzen.'],example:'m=2, b=1 → f(x)=2x+1.',mistake:'m und b nicht vertauschen.'},
 {course:'linBasic',title:'Steigung aus zwei Punkten',terms:['Steigung','Punkte','Differenz'],formula:'m=(y₂−y₁):(x₂−x₁)',text:'Die Steigung sagt: Wie stark ändert sich y, wenn x um 1 größer wird?',steps:['Zwei Punkte auswählen.','y-Werte abziehen.','x-Werte abziehen.','y-Differenz durch x-Differenz teilen.'],example:'P(−1|−1), Q(2|5) → m=(5−(−1)):(2−(−1))=6:3=2.',mistake:'Die Reihenfolge muss oben und unten gleich bleiben.'},

 {course:'linGraphs',title:'Graphen lesen wie im Koordinatensystem',terms:['Graph','Koordinatensystem','y-Achse','Steigungsdreieck'],formula:'b bei x=0 ablesen | m = hoch/runter : rechts',text:'Graphen werden leichter, wenn du immer gleich vorgehst: erst b, dann m. Markierte Punkte helfen dabei.',steps:['Schnitt mit der y-Achse suchen: das ist b.','Zweiten sauberen Punkt suchen.','Von links nach rechts zählen: wie viel nach oben/unten?','m bilden und Gleichung schreiben.'],example:'Gerade durch (0|1) und (2|5): m=4:2=2, b=1 → f(x)=2x+1.',mistake:'Beim Fallen ist m negativ.'},

let state=loadState();let activeQuiz=null;
function emptyState(){return {history:[],currentQuiz:null}}
function questionExists(id){return QUESTIONS.some(q=>q.id===id)}
function sanitizeState(raw){
 const clean=emptyState();
 if(!raw||typeof raw!=='object')return clean;
 clean.history=Array.isArray(raw.history)?raw.history.filter(Boolean):[];
 const qz=raw.currentQuiz;
 if(qz&&Array.isArray(qz.ids)){
  const ids=qz.ids.filter(questionExists);
  if(ids.length){clean.currentQuiz={...qz,ids,index:Math.min(Math.max(Number(qz.index)||0,0),ids.length-1),answers:qz.answers&&typeof qz.answers==='object'?qz.answers:{}}}
 }
 return clean;
}
function loadState(){try{return sanitizeState(JSON.parse(localStorage.getItem(STORAGE_KEY)))}catch(e){return emptyState()}}
function saveState(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){console.warn('Speichern nicht möglich',e)}}
function repairBrokenQuiz(){state.currentQuiz=null;saveState();activeQuiz=null;app.innerHTML=`<section class="card"><p class="eyebrow">Speicher repariert</p><h1>Die Seite hatte einen alten/kaputten Quiz-Speicherstand.</h1><p class="lead">Ich habe nur das angefangene Quiz zurückgesetzt. Deine App ist nicht weg und du kannst normal neu starten.</p><div class="row"><button class="btn primary" onclick="renderSetup()">Neues Quiz starten</button><button class="btn secondary" onclick="renderHome()">Zur Startseite</button></div></section>`}
window.addEventListener('error',()=>{try{repairBrokenQuiz()}catch(e){}});
function setTheme(t){document.body.classList.toggle('dark',t==='dark');localStorage.setItem(THEME_KEY,t);document.getElementById('themeBtn').textContent=t==='dark'?'☀️ Light':'🌙 Dark'}
const app=document.getElementById('app');
function course(id){return COURSES.find(c=>c.id===id)||COURSES[0]}
function countByCourse(id){return QUESTIONS.filter(q=>q.course===id).length}
function renderHome(){activeQuiz=null;const current=state.currentQuiz;app.innerHTML=`<section class="hero"><div class="heroPanel"><p class="eyebrow">Mathe Abschlussarbeit</p><h1>Üben in Kursen, mit schönen Graphen und Hilfen.</h1><p class="lead">Jetzt mit Kurs-Auswahl, Schwierigkeit pro Kurs, ausführlichem Lernmodus, interaktiven Geraden, offizieller Formelsammlung und Lehrerschmidt-Videos.</p><div class="spacer"></div><div class="pillrow"><span class="pill">${QUESTIONS.length} Aufgaben</span><span class="pill">${COURSES.length} Kurse</span><span class="pill">Speichert automatisch</span><span class="pill">Mobil & PC</span><span class="pill">Videos in der App</span></div><div class="spacer"></div><div class="row"><button class="btn primary" onclick="renderSetup()">Quiz starten</button><button class="btn secondary" onclick="renderLearn()">Lernmodus öffnen</button><button class="btn secondary" onclick="renderVideos()">🎥 Videos</button>${current?'<button class="btn success" onclick="continueQuiz()">Gespeichertes Quiz fortsetzen</button>':''}</div></div><aside class="card"><h2>Was neu ist</h2><p>Graphen sind jetzt als saubere SVG-Grafiken direkt in den Aufgaben eingebaut. Bei manchen Aufgaben kannst du die Gerade mit Reglern selbst einstellen.</p><div class="quickHelp"><div class="quickCard"><strong>📈 Graphen</strong>Ablesen, Schnittpunkt, Nullstelle, Steigung.</div><div class="quickCard"><strong>🎚️ Interaktiv</strong>m und b selbst einstellen.</div><div class="quickCard"><strong>🎯 Schwierigkeit</strong>Pro Kurs einfach, normal, schwer oder gemischt.</div></div></aside></section><div class="spacer"></div><section class="card"><div class="spread"><div><p class="eyebrow">Kurse</p><h2>Wähle später genau aus, was du üben willst</h2></div><button class="btn secondary" onclick="toggleFormula(true)">📐 Formelsammlung</button></div><div class="courseGrid">${COURSES.map(c=>`<article class="courseCard"><div class="courseIcon">${c.icon}</div><h3>${c.title}</h3><p>${c.desc}</p><div class="courseStats"><span class="tag">${countByCourse(c.id)} Aufgaben</span><span class="tag">${c.short}</span></div><button class="btn secondary" onclick="renderLearn('${c.id}')">Lernen</button> <button class="btn primary" onclick="startQuick('${c.id}')">Üben</button></article>`).join('')}</div></section>`}
function renderLearn(initial='all'){activeQuiz=null;app.innerHTML=`<section class="card"><p class="eyebrow">Lernmodus</p><h1>Begriffe suchen und Kapitel lernen</h1><p class="lead">Der Lernmodus erklärt genauer und mit Beispielen. Suche z. B. <span class="kbd">Pythagoras</span>, <span class="kbd">Kreis</span>, <span class="kbd">Fake Statistik</span>, <span class="kbd">Graph</span>, <span class="kbd">Steigung</span>, <span class="kbd">Rechenweg</span>.</p><div class="quickHelp"><div class="quickCard"><strong>🧠 Dyskalkulie-Hilfe</strong>Immer gleich: Gegeben → Gesucht → Formel → Einsetzen → Antwortsatz.</div><div class="quickCard"><strong>📈 Graphen-Hilfe</strong>Erst b an der y-Achse suchen, dann m mit einem Steigungsdreieck ablesen.</div><div class="quickCard"><strong>📊 Statistik-Check</strong>Achse, Einheit, Zeitraum, Stichprobe, Ausreißer prüfen.</div><div class="quickCard"><strong>🎥 Video-Hilfe</strong>Direkt passende Lehrerschmidt-Videos in der App ansehen.<br><button class="btn secondary" onclick="renderVideos()">Videos öffnen</button></div></div><div class="learnControls"><input id="searchInput" class="input search" placeholder="Begriff suchen …" oninput="renderLearnCards()"><select id="courseFilter" class="select" onchange="renderLearnCards()"><option value="all">Alle Kurse</option>${COURSES.map(c=>`<option value="${c.id}" ${initial===c.id?'selected':''}>${c.icon} ${c.title}</option>`).join('')}</select><select id="learnDepth" class="select" onchange="renderLearnCards()"><option value="full">Ausführlich</option><option value="short">Kurz</option></select></div></section><div class="spacer"></div><section id="learnCards" class="learnGrid"></section>`;renderLearnCards()}
function renderLearnCards(){const query=norm(document.getElementById('searchInput')?.value||'');const filter=document.getElementById('courseFilter')?.value||'all';const depth=document.getElementById('learnDepth')?.value||'full';const data=LEARN.filter(item=>{const hay=norm([item.title,item.text,item.formula,item.example,item.mistake,...item.terms].join(' '));return (filter==='all'||item.course===filter)&&(!query||hay.includes(query))});const grouped=COURSES.map(c=>({c,items:data.filter(i=>i.course===c.id)})).filter(g=>g.items.length);const el=document.getElementById('learnCards');el.innerHTML=grouped.length?grouped.map(g=>`<article class="card learnChapter"><div class="spread"><h2>${g.c.icon} ${g.c.title}</h2><span class="tag">${g.items.length} Karten</span></div>${g.items.map(item=>`<div class="learnCard"><div class="terms">${item.terms.map(t=>`<span class="term">#${esc(t)}</span>`).join('')}</div><h3>${esc(item.title)}</h3><p>${esc(item.text)}</p><div class="formula">${esc(item.formula)}</div>${depth==='full'?`<details open><summary>Rechenweg / Merkschritte</summary><ol class="steps">${item.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></details><div class="exampleBox"><strong>Beispiel:</strong> ${esc(item.example)}</div><p class="mistake"><strong>Häufiger Fehler:</strong> ${esc(item.mistake)}</p>`:`<p><strong>Beispiel:</strong> ${esc(item.example)}</p>`}<button class="btn secondary" onclick="startQuick('${item.course}')">Dazu üben</button></div>`).join('')}</article>`).join(''):`<article class="card"><h2>Nichts gefunden</h2><p>Versuche einen anderen Begriff, z. B. „Steigung“, „Median“, „Pythagoras“ oder „Kreis“.</p></article>`}
function renderSetup(){activeQuiz=null;app.innerHTML=`<section class="card"><p class="eyebrow">Quiz starten</p><h1>Kurse und Schwierigkeit auswählen</h1><p class="lead">Du kannst jetzt bei jedem Kurs einzeln einstellen, ob du einfache, normale, schwere oder gemischte Aufgaben willst.</p><div class="setupGrid"><div><h2>Kurse</h2><div class="courseGrid">${COURSES.map(c=>`<label class="coursePick"><input type="checkbox" name="course" value="${c.id}" ${c.id.includes('lin')?'checked':''}><span><strong>${c.icon} ${c.title}</strong><small>${c.short} · ${countByCourse(c.id)} Aufgaben</small><select class="select" data-diff="${c.id}" onclick="event.stopPropagation()"><option value="easy">Einfach</option><option value="normal" selected>Normal</option><option value="hard">Schwer</option><option value="mix">Gemischt</option></select></span></label>`).join('')}</div></div><aside><h2>Optionen</h2><label><strong>Anzahl Fragen insgesamt</strong><select id="count" class="select"><option value="8">8 kurz</option><option value="12" selected>12 normal</option><option value="20">20 intensiv</option><option value="40">40 sehr intensiv</option><option value="all">Alle passenden</option></select></label><div class="spacer"></div><label><strong>Modus</strong><select id="mode" class="select"><option value="practice">Lern-Quiz mit Tipps</option><option value="exam">Prüfungsmodus gemischt</option></select></label><div class="spacer"></div><button class="btn primary" onclick="startFromSetup()">Starten</button><button class="btn secondary" onclick="toggleFormula(true)">Formeln öffnen</button><hr><p class="small">Tipp: Für lineare Funktionen am besten „Basics“, „Graphen“ und „Sachaufgaben“ zusammen wählen.</p></aside></div></section>`}
function startQuick(courseId){const spec={};spec[courseId]='mix';startQuiz({spec,count:10,mode:'practice',title:`${course(courseId).title} üben`})}
function continueQuiz(){if(!state.currentQuiz)return renderHome();activeQuiz=sanitizeState({history:[],currentQuiz:state.currentQuiz}).currentQuiz;if(!activeQuiz)return repairBrokenQuiz();state.currentQuiz=activeQuiz;saveState();renderQuiz()}
function startFromSetup(){const selected=[...document.querySelectorAll('input[name="course"]:checked')].map(x=>x.value);if(!selected.length){alert('Bitte mindestens einen Kurs auswählen.');return}const spec={};selected.forEach(id=>spec[id]=document.querySelector(`[data-diff="${id}"]`)?.value||'mix');const count=document.getElementById('count').value;const mode=document.getElementById('mode').value;startQuiz({spec,count,mode,title:'Eigenes Quiz'})}
function startQuiz({spec,count=12,mode='practice',title='Quiz',customIds=null}){let ids;if(customIds){ids=customIds.filter(questionExists)}else{let pool=QUESTIONS.filter(q=>spec[q.course]&&(spec[q.course]==='mix'||q.diff===spec[q.course]));if(pool.length<4){pool=QUESTIONS.filter(q=>spec[q.course])}ids=shuffle(pool.map(q=>q.id));if(count!=='all')ids=ids.slice(0,Number(count))}if(!ids.length){alert('Für diese Auswahl wurden keine Aufgaben gefunden. Bitte wähle einen anderen Kurs.');return}activeQuiz={ids,index:0,answers:{},mode,title,spec,startedAt:Date.now()};state.currentQuiz=activeQuiz;saveState();renderQuiz()}
function currentQ(){return activeQuiz&&Array.isArray(activeQuiz.ids)?QUESTIONS.find(q=>q.id===activeQuiz.ids[activeQuiz.index]):null}
function renderQuiz(){if(!activeQuiz)return renderHome();const q=currentQ();if(!q)return repairBrokenQuiz();const c=course(q.course);const saved=activeQuiz.answers[q.id];const pct=Math.round(activeQuiz.index/activeQuiz.ids.length*100);app.innerHTML=`<section class="quizLayout"><article class="card"><div class="spread"><span class="tag">${c.icon} ${c.title} · ${DIFFS[q.diff]} · ${esc(q.sub||'Aufgabe')}</span><span class="small">Frage ${activeQuiz.index+1} von ${activeQuiz.ids.length}</span></div><div class="spacer"></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="spacer"></div><h1 class="qTitle">${esc(q.prompt)}</h1><div class="answerBox">${answerHTML(q,saved)}</div><div id="tipBox"></div><div id="feedbackBox">${saved?.checked?feedbackHTML(q,saved):''}</div><div class="spacer"></div><div class="row noPrint"><button class="btn secondary" onclick="prevQ()" ${activeQuiz.index===0?'disabled':''}>← Zurück</button><button class="btn secondary" onclick="showTip()">💡 Tipp</button><button class="btn danger" onclick="renderSetup()">Abbrechen</button><button id="nextBtn" class="btn primary grow" onclick="nextIntegrated()">${saved?.checked?(activeQuiz.index===activeQuiz.ids.length-1?'Ergebnis anzeigen':'Weiter →'):'Weiter'}</button></div></article><aside class="card quizSide noPrint"><h3>Navigation</h3><p class="small">Grün = richtig, rot = nochmal üben.</p><div class="qNav">${activeQuiz.ids.map((id,i)=>{const a=activeQuiz.answers[id];let cls=i===activeQuiz.index?'now ':'';if(a?.checked)cls+=a.correct?'good':'bad';return `<button class="dot ${cls}" onclick="jumpQ(${i})">${i+1}</button>`}).join('')}</div><hr><p><strong>Speicher:</strong> automatisch im Browser.</p><button class="btn secondary" onclick="saveState();alert('Gespeichert!')">Jetzt speichern</button><button class="btn secondary" onclick="toggleFormula(true)">📐 Formeln</button></aside></section>`}
function mediaHTML(q){let out='';if(q.graph)out+=`<div class="mediaBox"><p class="mediaTitle">Graph / Koordinatensystem</p>${graphSVG(q.graph)}${q.graph.caption?`<p class="graphCaption">${esc(q.graph.caption)}</p>`:''}</div>`;if(q.chart)out+=`<div class="mediaBox"><p class="mediaTitle">Statistik-Diagramm</p>${chartSVG(q.chart)}${q.chart.warn?`<span class="chartWarn">${esc(q.chart.warn)}</span>`:''}</div>`;if(q.figure)out+=`<div class="mediaBox"><p class="mediaTitle">Skizze</p>${figureSVG(q.figure)}</div>`;return out}
function answerHTML(q,saved){const val=saved?.value??'';const media=mediaHTML(q);if(q.type==='graphSlider'){const m=typeof val==='object'&&val?Number(val.m):(q.start?.m??0);const b=typeof val==='object'&&val?Number(val.b):(q.start?.b??0);return `${media}<div class="mediaBox"><p class="mediaTitle">Interaktiver Graph</p><div id="sliderGraphWrap">${graphSVG({title:'Deine Gerade: y = m·x + b',xMin:-5,xMax:5,yMin:-5,yMax:7,lines:[{m,b,label:'deine Gerade'}],points:[{x:0,y:b,label:'b'}]})}</div><div class="sliderBox"><label class="sliderRow"><strong>m</strong><input id="mSlider" type="range" min="-4" max="4" step="0.5" value="${m}" oninput="updateSliderGraph()"><span id="mVal">${fmt(m)}</span></label><label class="sliderRow"><strong>b</strong><input id="bSlider" type="range" min="-5" max="5" step="0.5" value="${b}" oninput="updateSliderGraph()"><span id="bVal">${fmt(b)}</span></label></div><p class="graphCaption">b verschiebt die Gerade hoch/runter, m macht sie steiler oder fallend.</p></div>`}
if(q.type==='choice')return `${media}<div class="options">${q.options.map((o,i)=>`<label class="option"><input type="radio" name="ans" value="${i}" ${String(val)===String(i)?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`;
if(q.type==='multi'){const vals=Array.isArray(val)?val.map(String):[];return `${media}<div class="options">${q.options.map((o,i)=>`<label class="option"><input type="checkbox" name="ans" value="${i}" ${vals.includes(String(i))?'checked':''}><span>${esc(o)}</span></label>`).join('')}</div>`}
if(q.type==='order'){const vals=Array.isArray(val)?val:q.items.map((_,i)=>i+1);return `${media}<p class="muted">Wähle links die Reihenfolge: 1 = kleinster/erster Wert.</p>${q.items.map((it,i)=>`<div class="orderRow"><select data-order="${i}">${q.items.map((_,n)=>`<option value="${n+1}" ${Number(vals[i])===n+1?'selected':''}>${n+1}</option>`).join('')}</select><strong>${esc(it)}</strong></div>`).join('')}`}
return `${media}<input id="answerInput" class="input search" type="text" inputmode="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Antwort mit Einheit, z. B. 14 kg oder 24 m^2" value="${esc(val)}"><p class="small" style="margin-top:8px">Tipp: Auf dem Handy kannst du Einheiten normal eintippen. m² geht auch als m^2, m³ als m^3.</p>`}
function collect(q){if(q.type==='choice'){const el=document.querySelector('input[name="ans"]:checked');return el?Number(el.value):null}if(q.type==='multi')return [...document.querySelectorAll('input[name="ans"]:checked')].map(x=>Number(x.value));if(q.type==='order')return [...document.querySelectorAll('[data-order]')].map(x=>Number(x.value));if(q.type==='graphSlider')return {m:Number(document.getElementById('mSlider')?.value),b:Number(document.getElementById('bSlider')?.value)};return document.getElementById('answerInput')?.value.trim()??''}
function nextIntegrated(){const q=currentQ();if(!q)return repairBrokenQuiz();const saved=activeQuiz.answers[q.id];if(saved?.checked){if(activeQuiz.index>=activeQuiz.ids.length-1)return finishQuiz();activeQuiz.index++;state.currentQuiz=activeQuiz;saveState();renderQuiz();return}const val=collect(q);if(val===null||val===''||(Array.isArray(val)&&val.length===0)){alert('Bitte erst eine Antwort eingeben oder auswählen.');return}const result=evaluate(q,val);activeQuiz.answers[q.id]={value:val,checked:true,correct:result.correct,normalized:result.normalized,at:Date.now()};document.getElementById('feedbackBox').innerHTML=feedbackHTML(q,activeQuiz.answers[q.id]);document.getElementById('nextBtn').textContent=activeQuiz.index===activeQuiz.ids.length-1?'Ergebnis anzeigen':'Weiter →';state.currentQuiz=activeQuiz;saveState()}
function showTip(){document.getElementById('tipBox').innerHTML=`<div class="tip"><strong>💡 Tipp ohne Lösung:</strong><br>${esc(currentQ().hint)}</div>`}
function prevQ(){if(activeQuiz.index>0){activeQuiz.index--;state.currentQuiz=activeQuiz;saveState();renderQuiz()}}
function jumpQ(i){activeQuiz.index=Math.min(Math.max(Number(i)||0,0),activeQuiz.ids.length-1);state.currentQuiz=activeQuiz;saveState();renderQuiz()}
function norm(s){return String(s??'').toLowerCase().replace(/\s+/g,'').replace(/,/g,'.').replace(/−/g,'-').replace(/[·*]/g,'').replace(/€/g,'eur').replace(/²/g,'2').replace(/³/g,'3')}
function parseNumber(s){s=String(s).replace(/,/g,'.');const frac=s.match(/(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)/);if(frac)return Number(frac[1])/Number(frac[2]);const m=s.match(/-?\d+(?:\.\d+)?/);return m?Number(m[0]):NaN}
function hasUnit(raw,unit){if(!unit)return true;const s=String(raw).toLowerCase().replace(/\s/g,'').replace(/²/g,'2').replace(/³/g,'3').replace(/€/g,'eur');const map={'cm':['cm'],'mm':['mm'],'m':['m'],'kg':['kg'],'g':['g'],'€':['eur','€','euro'],'tage':['tag','tage','t'],'liter':['liter','l'],'m²':['m2','m^2','qm'],'m³':['m3','m^3','kubikmeter'],'h':['h','std','stunden'],'°f':['°f','f'],'cm³':['cm3','cm^3'],'cm²':['cm2','cm^2'],'prozentpunkte':['prozentpunkte','prozentpunkt','pp'],'%':['%','prozent'],'min':['min','minute','minuten']};return (map[unit.toLowerCase()]||[unit.toLowerCase()]).some(a=>s.includes(a))}
function sameArray(a,b){return a.length===b.length&&a.every((x,i)=>Number(x)===Number(b[i]))}
function sameSet(a,b){return sameArray([...a].sort((x,y)=>x-y),[...b].sort((x,y)=>x-y))}
function evaluate(q,val){if(q.type==='choice')return {correct:Number(val)===Number(q.answer),normalized:val};if(q.type==='multi')return {correct:sameSet(val,q.answer),normalized:val};if(q.type==='order'){const ordered=q.items.map((item,i)=>({item,rank:val[i]})).sort((a,b)=>a.rank-b.rank).map(x=>Number(x.item));return {correct:sameArray(ordered,q.answer),normalized:ordered.join(', ')}}if(q.type==='graphSlider'){return {correct:Math.abs(Number(val.m)-Number(q.answer.m))<0.001&&Math.abs(Number(val.b)-Number(q.answer.b))<0.001,normalized:`m=${fmt(val.m)}, b=${fmt(val.b)}`}}if(q.numeric){const num=parseNumber(val);const tol=typeof q.tolerance==='number'?q.tolerance:0.0001;const okNum=!Number.isNaN(num)&&Math.abs(num-Number(q.answer))<=tol;const okUnit=q.mustUnit?hasUnit(val,q.unit):true;return {correct:okNum&&okUnit,normalized:num}}if(q.textAnswers){const user=norm(val);return {correct:q.textAnswers.some(a=>norm(a)===user),normalized:user}}return {correct:false,normalized:val}}
function answerText(q){if(q.type==='choice')return q.options[q.answer];if(q.type==='multi')return q.answer.map(i=>q.options[i]).join('; ');if(q.type==='order')return q.answer.join(', ');if(q.type==='graphSlider')return `m=${fmt(q.answer.m)}, b=${fmt(q.answer.b)}`;if(q.textAnswers)return q.textAnswers[0];return `${String(q.answer).replace('.',',')}${q.unit?' '+q.unit:''}`}
function userText(q,a){if(!a)return '–';if(q.type==='choice')return q.options[a.value]||'–';if(q.type==='multi')return (a.value||[]).map(i=>q.options[i]).join('; ')||'–';if(q.type==='order')return a.normalized||'–';if(q.type==='graphSlider')return `m=${fmt(a.value?.m)}, b=${fmt(a.value?.b)}`;return a.value}
function feedbackHTML(q,a){return `<div class="feedback ${a.correct?'good':'bad'}"><h3>${a.correct?'✅ Richtig':'❌ Noch nicht richtig'}</h3><p><strong>Deine Antwort:</strong> ${esc(userText(q,a))}</p>${a.correct?'':`<p><strong>Richtige Lösung:</strong> ${esc(answerText(q))}</p>`}<p><strong>Erklärung:</strong> ${esc(q.explanation)}</p></div>`}
function finishQuiz(){activeQuiz.finished=true;const correct=activeQuiz.ids.filter(id=>activeQuiz.answers[id]?.correct).length;const total=activeQuiz.ids.length;const percent=Math.round(correct/total*100);const done={...activeQuiz,score:correct,total,percent,finishedAt:Date.now()};state.history.unshift(done);state.history=state.history.slice(0,40);state.currentQuiz=null;saveState();activeQuiz=done;renderResults(done)}
function renderResults(qz){const correct=qz.score??qz.ids.filter(id=>qz.answers[id]?.correct).length;const total=qz.total??qz.ids.length;const percent=qz.percent??Math.round(correct/total*100);const wrongIds=qz.ids.filter(id=>!qz.answers[id]?.correct);app.innerHTML=`<section class="card"><p class="eyebrow">Auswertung</p><h1>${correct} / ${total} richtig</h1><div class="statGrid"><div class="stat"><strong>${percent}%</strong><span>Trefferquote</span></div><div class="stat"><strong>${total-correct}</strong><span>Fehler</span></div><div class="stat"><strong>${total}</strong><span>Fragen</span></div></div><p class="lead">Hier stehen alle Lösungen mit Erklärung. Du kannst die Seite über den Browser drucken oder als PDF speichern.</p><div class="row noPrint"><button class="btn secondary" onclick="window.print()">🖨️ Drucken / PDF</button>${wrongIds.length?`<button class="btn primary" onclick='startQuiz({spec:{basics:"mix"},mode:"practice",count:"all",customIds:${JSON.stringify(wrongIds)},title:"Fehler wiederholen"})'>Fehler wiederholen</button>`:''}<button class="btn secondary" onclick="renderSetup()">Neues Quiz</button><button class="btn secondary" onclick="renderHome()">Start</button></div></section><div class="spacer"></div><section class="resultList">${qz.ids.map((id,i)=>{const q=QUESTIONS.find(x=>x.id===id);const a=qz.answers[id];if(!q)return `<article class="result wrong"><span class="tag">${i+1}. Alte Aufgabe</span><h3>Diese Aufgabe stammt aus einer älteren Version und wurde übersprungen.</h3></article>`;return `<article class="result ${a?.correct?'correct':'wrong'}"><span class="tag">${i+1}. ${course(q.course).title} · ${DIFFS[q.diff]}</span><h3>${esc(q.prompt)}</h3><p><strong>Deine Antwort:</strong> ${esc(userText(q,a))}</p><p><strong>Richtige Lösung:</strong> ${esc(answerText(q))}</p><p><strong>Erklärung:</strong> ${esc(q.explanation)}</p></article>`}).join('')}</section>`}
function renderProgress(){activeQuiz=null;const hist=state.history||[];const answered=hist.reduce((s,h)=>s+(h.total||h.ids?.length||0),0);const correct=hist.reduce((s,h)=>s+(h.score||0),0);const avg=answered?Math.round(correct/answered*100):0;app.innerHTML=`<section class="card"><p class="eyebrow">Fortschritt</p><h1>Gespeicherte Ergebnisse</h1><div class="statGrid"><div class="stat"><strong>${hist.length}</strong><span>Quizze</span></div><div class="stat"><strong>${answered}</strong><span>Fragen</span></div><div class="stat"><strong>${avg}%</strong><span>Durchschnitt</span></div></div><div class="row"><button class="btn primary" onclick="renderSetup()">Weiter üben</button><button class="btn danger" onclick="resetProgress()">Alles löschen</button></div></section><div class="spacer"></div><section class="resultList">${hist.length?hist.map((h,i)=>`<article class="result"><h3>${esc(h.title)}</h3><p><strong>${h.score}/${h.total}</strong> richtig (${h.percent}%).</p><p class="small">${new Date(h.finishedAt).toLocaleString('de-DE')}</p><button class="btn secondary" onclick="renderResults(state.history[${i}])">Lösungen ansehen</button></article>`).join(''):'<article class="card"><h2>Noch keine Ergebnisse</h2><p>Starte ein Quiz, dann wird hier gespeichert.</p></article>'}</section>`}
function resetProgress(){if(confirm('Wirklich Fortschritt und Speicherstand löschen?')){state={history:[],currentQuiz:null};saveState();renderProgress()}}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function graphSVG(g){const W=620,H=410,pad=52;const xMin=g.xMin??-5,xMax=g.xMax??5,yMin=g.yMin??-5,yMax=g.yMax??5;const sx=x=>pad+(x-xMin)/(xMax-xMin)*(W-2*pad);const sy=y=>H-pad-(y-yMin)/(yMax-yMin)*(H-2*pad);let out=`<svg class="graphSvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(g.title||'Graph')}"><defs><linearGradient id="gridFade" x1="0" x2="1"><stop offset="0" stop-color="var(--primary)"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs><text x="${W/2}" y="26" text-anchor="middle" font-size="17" font-weight="900" fill="var(--text)">${esc(g.title||'Graph')}</text>`;const xStep=niceStep(xMin,xMax),yStep=niceStep(yMin,yMax);for(let x=Math.ceil(xMin/xStep)*xStep;x<=xMax+1e-9;x+=xStep){const X=sx(x);out+=`<line x1="${X}" y1="${pad}" x2="${X}" y2="${H-pad}" stroke="var(--line)"/><text x="${X}" y="${H-pad+22}" text-anchor="middle" font-size="12" fill="var(--muted)">${Math.abs(x)<1e-9?'':fmt(x)}</text>`}for(let y=Math.ceil(yMin/yStep)*yStep;y<=yMax+1e-9;y+=yStep){const Y=sy(y);out+=`<line x1="${pad}" y1="${Y}" x2="${W-pad}" y2="${Y}" stroke="var(--line)"/><text x="${pad-10}" y="${Y+4}" text-anchor="end" font-size="12" fill="var(--muted)">${Math.abs(y)<1e-9?'':fmt(y)}</text>`}if(xMin<=0&&xMax>=0)out+=`<line x1="${sx(0)}" y1="${pad}" x2="${sx(0)}" y2="${H-pad}" stroke="var(--muted)" stroke-width="2.2"/><text x="${sx(0)+10}" y="${pad+14}" font-size="13" fill="var(--muted)">y</text>`;if(yMin<=0&&yMax>=0)out+=`<line x1="${pad}" y1="${sy(0)}" x2="${W-pad}" y2="${sy(0)}" stroke="var(--muted)" stroke-width="2.2"/><text x="${W-pad-14}" y="${sy(0)-8}" font-size="13" fill="var(--muted)">x</text>`;(g.lines||[]).forEach((ln,i)=>{const col=['url(#gridFade)','var(--accent)','var(--good)','#38bdf8'][i%4];const x1=xMin,x2=xMax,y1=ln.m*x1+ln.b,y2=ln.m*x2+ln.b;out+=`<line x1="${sx(x1)}" y1="${sy(y1)}" x2="${sx(x2)}" y2="${sy(y2)}" stroke="${col}" stroke-width="4" stroke-linecap="round"/><text x="${Math.min(W-pad-45,Math.max(pad+8,sx(xMax)-42))}" y="${Math.min(H-pad-8,Math.max(pad+16,sy(y2)-8))}" fill="${i===0?'var(--primary)':col}" font-weight="900">${esc(ln.label||'')}</text>`});if(g.tri){const t=g.tri;out+=`<path d="M${sx(t.x)} ${sy(t.y)} L${sx(t.x+t.dx)} ${sy(t.y)} L${sx(t.x+t.dx)} ${sy(t.y+t.dy)}" fill="none" stroke="var(--bad)" stroke-width="3" stroke-dasharray="7 5"/><text x="${(sx(t.x)+sx(t.x+t.dx))/2}" y="${sy(t.y)+18}" font-size="13" fill="var(--bad)" font-weight="900">Δx=${fmt(t.dx)}</text><text x="${sx(t.x+t.dx)+7}" y="${(sy(t.y)+sy(t.y+t.dy))/2}" font-size="13" fill="var(--bad)" font-weight="900">Δy=${fmt(t.dy)}</text>`}(g.points||[]).forEach(pt=>{out+=`<g><circle cx="${sx(pt.x)}" cy="${sy(pt.y)}" r="6" fill="var(--bad)"/><circle cx="${sx(pt.x)}" cy="${sy(pt.y)}" r="12" fill="var(--bad)" opacity=".13"/><text x="${sx(pt.x)+9}" y="${sy(pt.y)-9}" fill="var(--text)" font-size="13" font-weight="900">${esc(pt.label||`(${pt.x}|${pt.y})`)}</text></g>`});out+='</svg>';return out}
function niceStep(min,max){const span=Math.abs(max-min);if(span<=10)return 1;if(span<=25)return 5;if(span<=80)return 10;if(span<=200)return 20;return 50}
function chartSVG(c){const W=620,H=380,pad=58;const vals=c.values||[];const yMin=c.yMin??0,yMax=c.yMax??Math.max(...vals.map(v=>v.value),10);const innerW=W-2*pad,innerH=H-2*pad;const bw=innerW/Math.max(vals.length,1)*0.56;const sy=y=>H-pad-(y-yMin)/(yMax-yMin)*innerH;let out=`<svg class="chartSvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||'Diagramm')}"><text x="${W/2}" y="27" text-anchor="middle" font-size="17" font-weight="900" fill="var(--text)">${esc(c.title||'Diagramm')}</text>`;const step=niceStep(yMin,yMax);for(let y=Math.ceil(yMin/step)*step;y<=yMax+1e-9;y+=step){const Y=sy(y);out+=`<line x1="${pad}" y1="${Y}" x2="${W-pad}" y2="${Y}" stroke="var(--line)"/><text x="${pad-10}" y="${Y+4}" text-anchor="end" font-size="12" fill="var(--muted)">${fmt(y)}%</text>`}out+=`<line x1="${pad}" y1="${sy(yMin)}" x2="${W-pad}" y2="${sy(yMin)}" stroke="var(--muted)" stroke-width="2"/>`;vals.forEach((v,i)=>{const x=pad+(i+.5)*innerW/vals.length-bw/2;const y=sy(v.value);const base=sy(yMin);out+=`<rect x="${x}" y="${y}" width="${bw}" height="${base-y}" rx="12" fill="var(--primary)" opacity=".9"/><text x="${x+bw/2}" y="${y-8}" text-anchor="middle" font-size="14" font-weight="900" fill="var(--text)">${fmt(v.value)}%</text><text x="${x+bw/2}" y="${H-pad+25}" text-anchor="middle" font-size="14" fill="var(--text)">${esc(v.label)}</text>`});out+='</svg>';return out}

function renderVideos(filter='all'){
 activeQuiz=null;
 const options=['all',...COURSES.map(c=>c.id)];
 const active=options.includes(filter)?filter:'all';
 const vids=LEHRER_VIDEOS.filter(v=>active==='all'||v.course===active);
 app.innerHTML=`<section class="card"><p class="eyebrow">Video-Lernhilfe</p><h1>Lehrerschmidt-Videos direkt in der App</h1><p class="lead">Die Videos brauchen Internet. Falls YouTube das Einbetten im Browser blockiert, kannst du jedes Video mit dem Button direkt bei YouTube öffnen.</p><div class="row"><select class="select" style="max-width:360px" onchange="renderVideos(this.value)"><option value="all">Alle Videos</option>${COURSES.map(c=>`<option value="${c.id}" ${active===c.id?'selected':''}>${c.icon} ${c.title}</option>`).join('')}</select><button class="btn secondary" onclick="renderLearn()">Zurück zum Lernmodus</button><button class="btn secondary" onclick="toggleFormula(true)">📐 Formeln öffnen</button></div><div class="officialHint"><strong>Mein Tipp:</strong> Erst Video schauen, dann direkt im passenden Kurs üben. Für Dyskalkulie ist es besser, nicht 10 Videos hintereinander zu schauen, sondern: Video → 3 Aufgaben → Fehler ansehen → nochmal versuchen.</div></section><div class="spacer"></div><section class="videoGrid">${vids.map(v=>`<article class="videoCard"><div class="videoFrame"><iframe src="https://www.youtube-nocookie.com/embed/${v.id}" title="${esc(v.title)}" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="videoMeta"><span class="tag">${esc(v.topic)}</span><span class="tag">${COURSES.find(c=>c.id===v.course)?.title||'Mathe'}</span></div><h3>${esc(v.title)}</h3><p class="muted">${esc(v.desc)}</p><button class="btn primary" onclick="startQuick('${v.course}')">Dazu Aufgaben üben</button><a class="btn secondary" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener">Bei YouTube öffnen</a></article>`).join('')}</section>`;
}
