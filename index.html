<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Python Lern- und Übungswebsite</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">Berufliche Informatik · Python</p>
      <h1>Python Lerntrainer</h1>
      <p class="subtitle">Lernmodus, Aufgaben, Challenge Mode und Python-Code-Editor mit Ausführung im Browser.</p>
    </div>
    <div class="top-actions">
      <button id="themeBtn" class="ghost">🌙 Dark Mode</button>
      <button id="resetBtn" class="ghost danger">Fortschritt zurücksetzen</button>
    </div>
  </header>

  <nav class="tabs" aria-label="Hauptnavigation">
    <button data-view="learn" class="active">📚 Lernmodus</button>
    <button data-view="tasks">✅ Aufgaben</button>
    <button data-view="challenge">🔥 Challenge</button>
    <button data-view="free">💻 Free Code</button>
    <button data-view="progress">📈 Fortschritt</button>
  </nav>

  <main id="app"></main>
  <footer>
    <span>Hinweis: Die Python-Ausführung nutzt Pyodide im Browser. Beim ersten Start braucht die Seite Internet, um die Python-Engine zu laden.</span>
  </footer>
  <script src="app.js"></script>
</body>
</html>
