<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MatheCoach Abschlussarbeit v5</title>
  <meta name="description" content="Dyskalkulie-freundliche Mathe LernApp mit Lernmodus, Quiz, Dark Mode und Speicherstand.">
  <style>
    :root{
      --bg:#f6f3ee; --bg2:#eef4ff; --card:#ffffff; --text:#1d2433; --muted:#667085; --line:#d9e0ea;
      --primary:#4257ff; --primary2:#2635cc; --accent:#ffb000; --good:#078562; --bad:#c83d35; --warn:#9a6700;
      --soft:#f3f6ff; --soft2:#fff8e8; --shadow:0 18px 55px rgba(17,24,39,.12); --radius:26px;
      --font:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --mono:"SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }
    body.dark{
      --bg:#0d111c; --bg2:#151a2b; --card:#171d2e; --text:#eef3ff; --muted:#a9b4c7; --line:#2c3449;
      --primary:#8da2ff; --primary2:#bdc7ff; --accent:#ffd166; --good:#6de0b4; --bad:#ff938c; --warn:#ffd166;
      --soft:#202842; --soft2:#2b2639; --shadow:0 18px 55px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at top left,var(--bg2),transparent 420px),linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font-family:var(--font);font-size:18px;line-height:1.55}
    button,input,select{font:inherit} button{cursor:pointer}
    .topbar{position:static;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px clamp(14px,3vw,34px);background:rgba(255,255,255,.78);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    body.dark .topbar{background:rgba(13,17,28,.82)}
    .brand{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--text);padding:0;text-align:left}.brand:hover{transform:none}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:17px;background:linear-gradient(135deg,var(--primary),#7c3aed);color:white;font-size:25px;font-weight:900;box-shadow:0 10px 28px rgba(66,87,255,.32)}.brand strong{display:block;font-size:20px}.brand small{display:block;color:var(--muted);font-size:13px}.nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    .wrap{max-width:1180px;margin:0 auto;padding:28px clamp(14px,3vw,34px) 80px}.grid{display:grid;gap:18px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.card{background:linear-gradient(180deg,var(--card),rgba(255,255,255,.88));border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(18px,2.6vw,32px)}body.dark .card{background:linear-gradient(180deg,var(--card),rgba(23,29,46,.92))}.hero{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.8fr);gap:18px;align-items:stretch}.heroPanel{background:linear-gradient(135deg,var(--primary),#7c3aed);color:white;border-radius:30px;padding:clamp(26px,4vw,48px);box-shadow:var(--shadow);position:relative;overflow:hidden}.heroPanel:after{content:"";position:absolute;right:-80px;bottom:-80px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.14)}
    h1,h2,h3{line-height:1.12;margin:0 0 12px}h1{font-size:clamp(34px,5.6vw,62px);letter-spacing:-.04em}h2{font-size:clamp(25px,3.4vw,36px);letter-spacing:-.03em}h3{font-size:23px}.lead{font-size:clamp(19px,2.2vw,22px);color:var(--muted);max-width:75ch}.heroPanel .lead{color:rgba(255,255,255,.84)}p{margin:0 0 14px}.muted{color:var(--muted)}.small{font-size:14px;color:var(--muted)}.eyebrow{margin:0 0 10px;text-transform:uppercase;letter-spacing:.13em;font-weight:900;font-size:13px;color:var(--primary)}.heroPanel .eyebrow{color:#fff1ba}.formula{font-family:var(--mono);font-size:19px;background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0;overflow-x:auto}.heroPanel .formula{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22)}
    .btn{border:1px solid transparent;border-radius:17px;padding:12px 16px;font-weight:900;transition:transform .12s ease, background .12s ease, border-color .12s ease;min-height:48px}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.primary{background:var(--primary);color:white}.primary:hover{background:var(--primary2)}.secondary{background:var(--soft);color:var(--text);border-color:var(--line)}.ghost{background:transparent;color:var(--text);border-color:var(--line)}.danger{background:#ffe6e3;color:#8a221c;border-color:#ffc6c0}body.dark .danger{background:#3b1c1f;color:#ffbbb7;border-color:#70363c}.success{background:#dbfaeb;color:#055d45;border-color:#a6efcf}body.dark .success{background:#12382d;color:#9df2ce;border-color:#28775f}.linkish{background:transparent;color:var(--primary);border:0;padding:0;font-weight:900}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.grow{margin-left:auto}.pillrow{display:flex;gap:9px;flex-wrap:wrap}.pill,.tag{display:inline-flex;gap:6px;align-items:center;padding:8px 12px;border:1px solid var(--line);background:var(--soft);border-radius:999px;font-size:14px;font-weight:900;color:var(--text)}.heroPanel .pill{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.25);color:white}.hidden{display:none!important}.spacer{height:18px}hr{border:0;border-top:1px solid var(--line);margin:20px 0}
    .chapterGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:16px}.chapterCard{position:relative;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:25px;padding:20px;box-shadow:0 10px 30px rgba(17,24,39,.06)}.chapterIcon{font-size:33px;margin-bottom:8px}.chapterCard p{color:var(--muted);font-size:16px}.chapterStats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.modeCard{border:1px solid var(--line);border-radius:22px;padding:18px;background:var(--soft);display:flex;gap:14px;align-items:flex-start}.modeCard input{width:25px;height:25px;accent-color:var(--primary);flex:0 0 auto}.input,.select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:18px;padding:14px 16px;min-height:54px;font-size:19px}.search{font-size:22px}.setupGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.checkboxList{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:14px}.check{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:20px;padding:15px;background:var(--soft)}.check input{width:25px;height:25px;accent-color:var(--primary);flex:0 0 auto}.check small{display:block;color:var(--muted)}
    .learnControls{display:grid;grid-template-columns:1.4fr .6fr;gap:12px;margin-top:18px}.learnGrid{display:grid;gap:16px}.learnChapter{display:grid;gap:14px}.learnCard{border:1px solid var(--line);border-radius:23px;background:var(--card);padding:18px}.learnCard details{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:12px 0}.learnCard summary{font-weight:900;cursor:pointer}.steps{padding-left:22px;margin:10px 0}.steps li{margin:7px 0}.terms{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.term{font-size:13px;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:5px 9px}
    .quizLayout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:18px}.quizSide{position:sticky;top:90px;align-self:start}.progress{height:15px;background:var(--soft);border:1px solid var(--line);border-radius:999px;overflow:hidden}.bar{height:100%;width:0%;background:linear-gradient(90deg,var(--primary),#7c3aed)}.qTitle{font-size:clamp(28px,4.4vw,48px)}.answerBox{margin-top:18px}.options{display:grid;gap:12px}.option{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:20px;padding:16px;background:var(--card);cursor:pointer}.option:hover{border-color:var(--primary)}.option input{width:25px;height:25px;accent-color:var(--primary);flex:0 0 auto}.orderRow{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:12px;background:var(--card);margin:10px 0}.orderRow select{width:86px;border:1px solid var(--line);border-radius:14px;background:var(--soft);color:var(--text);padding:10px}.tip{background:var(--soft2);border:1px dashed var(--accent);border-radius:20px;padding:15px 16px;margin-top:16px}.feedback{border-radius:20px;border:1px solid var(--line);padding:16px;margin-top:16px}.feedback.good{background:rgba(7,133,98,.12);border-color:var(--good)}.feedback.bad{background:rgba(200,61,53,.12);border-color:var(--bad)}.feedback.good h3{color:var(--good)}.feedback.bad h3{color:var(--bad)}.qNav{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.dot{height:42px;border-radius:14px;border:1px solid var(--line);background:var(--soft);color:var(--text);font-weight:900}.dot.now{outline:3px solid rgba(66,87,255,.25);border-color:var(--primary)}.dot.good{background:rgba(7,133,98,.18);border-color:var(--good)}.dot.bad{background:rgba(200,61,53,.16);border-color:var(--bad)}.statGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:18px 0}.stat{border:1px solid var(--line);background:var(--soft);border-radius:22px;padding:18px}.stat strong{display:block;font-size:36px;line-height:1}.resultList{display:grid;gap:14px}.result{border:1px solid var(--line);border-left-width:8px;border-radius:22px;background:var(--card);padding:18px}.result.correct{border-left-color:var(--good)}.result.wrong{border-left-color:var(--bad)}.kbd{font-family:var(--mono);background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:2px 6px}.printOnly{display:none}
    @media(max-width:900px){.hero,.two,.three,.setupGrid,.quizLayout,.learnControls{grid-template-columns:1fr}.quizSide{position:static}.topbar{align-items:center;flex-direction:row;gap:10px;padding:10px 12px}.brand{gap:10px}.brand small{display:none}.logo{width:42px;height:42px;border-radius:15px;font-size:22px}.nav{justify-content:flex-end;gap:6px}.nav .btn{min-height:42px;padding:9px 11px;border-radius:14px;font-size:15px}.grow{margin-left:0}}
    @media(max-width:520px){body{font-size:17px}.wrap{padding-inline:12px}.card,.heroPanel{border-radius:22px}.btn{width:100%}.row .btn{width:auto}.qNav{grid-template-columns:repeat(4,1fr)}}
    @media print{.topbar,.noPrint,.quizSide{display:none!important}body{background:white;color:#111}.wrap{padding:0}.card,.result{box-shadow:none;border-color:#bbb;break-inside:avoid}.printOnly{display:block}}

    /* v4: Formelsammlung + Graphen */
    .formulaToggle{position:fixed;right:18px;bottom:18px;z-index:60;border:0;border-radius:999px;background:linear-gradient(135deg,var(--primary),#7c3aed);color:white;font-weight:1000;padding:14px 18px;box-shadow:0 18px 45px rgba(66,87,255,.32);min-height:54px}
    .formulaPanel{position:fixed;top:0;right:0;z-index:70;width:min(420px,92vw);height:100vh;background:var(--card);border-left:1px solid var(--line);box-shadow:-20px 0 60px rgba(0,0,0,.20);transform:translateX(104%);transition:transform .18s ease;display:flex;flex-direction:column}
    .formulaPanel.open{transform:translateX(0)}
    .formulaHead{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;background:linear-gradient(180deg,var(--card),var(--soft))}
    .formulaBody{padding:18px;overflow:auto;display:grid;gap:14px}
    .formulaMini{border:1px solid var(--line);border-radius:20px;background:var(--soft);padding:14px}
    .formulaMini h3{font-size:19px;margin-bottom:8px}.formulaMini ul{margin:8px 0 0;padding-left:20px}.formulaMini li{margin:6px 0}.formulaMini .formula{font-size:15px;padding:10px;border-radius:14px;margin:8px 0;background:var(--card)}
    .formulaBackdrop{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:65;display:none}.formulaBackdrop.open{display:block}
    .mediaBox{margin:18px 0;border:1px solid var(--line);border-radius:24px;background:var(--soft);padding:14px;overflow:auto}.mediaTitle{font-weight:1000;margin:0 0 10px;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.08em}.graphSvg,.chartSvg{width:100%;max-width:560px;min-width:280px;display:block;margin:auto;background:var(--card);border:1px solid var(--line);border-radius:18px}.graphSmall{max-width:360px}.graphCaption{font-size:14px;color:var(--muted);margin:10px 0 0;text-align:center}.sliderBox{display:grid;gap:14px;margin-top:16px}.sliderRow{display:grid;grid-template-columns:72px 1fr 64px;gap:10px;align-items:center;border:1px solid var(--line);border-radius:18px;padding:12px;background:var(--card)}.sliderRow input{width:100%;accent-color:var(--primary)}.miniHelp{border:1px solid var(--line);border-left:7px solid var(--accent);background:var(--soft2);border-radius:20px;padding:15px;margin:14px 0}.learningExtras{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:18px}.quickCard{border:1px solid var(--line);background:var(--soft);border-radius:20px;padding:15px}.quickCard strong{display:block;margin-bottom:6px}.chartWarn{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--soft2);border:1px solid var(--accent);font-size:13px;font-weight:900;margin-top:8px}
    @media(min-width:1160px){.wrap.withFormulaHint{padding-right:86px}.formulaToggle{right:24px;bottom:24px}}
    @media(max-width:680px){.formulaToggle{right:12px;bottom:12px;padding:12px 14px;font-size:15px}.formulaPanel{width:100vw}.formulaHead{padding:14px}.formulaBody{padding:14px}.sliderRow{grid-template-columns:54px 1fr 46px}.mediaBox{padding:10px;border-radius:18px}.graphSvg,.chartSvg{min-width:240px}.topbar{padding:10px 12px}.nav .btn{padding:10px 11px;min-height:42px}.logo{width:42px;height:42px}.brand strong{font-size:18px}}

  </style>
  <!-- v3: Top-Menü ist nicht mehr sticky/fest am oberen Rand und auf dem Handy kompakter. -->
</head>
<body>
  <header class="topbar noPrint">
    <button class="brand" id="brandBtn" aria-label="Startseite">
      <span class="logo">ƒx</span>
      <span><strong>MatheCoach</strong><small>Abschlussarbeit · Dyskalkulie-freundlich</small></span>
    </button>
    <nav class="nav" aria-label="Navigation">
      <button class="btn ghost" data-screen="home">Start</button>
      <button class="btn ghost" data-screen="learn">Lernmodus</button>
      <button class="btn ghost" data-screen="setup">Quiz</button>
      <button class="btn ghost" data-screen="progress">Fortschritt</button>
      <button class="btn secondary" id="themeBtn">🌙 Dark</button>
    </nav>
  </header>
  <main id="app" class="wrap withFormulaHint"></main>
  <button class="formulaToggle" id="formulaToggle" title="Formelsammlung öffnen">📐 Formeln</button>
  <div class="formulaBackdrop" id="formulaBackdrop"></div>
  <aside class="formulaPanel" id="formulaPanel" aria-label="Formelsammlung">
    <div class="formulaHead"><div><strong>📐 Formelsammlung</strong><br><span class="small">aufklappbar · mobil & PC</span></div><button class="btn secondary" id="formulaClose">×</button></div>
    <div class="formulaBody" id="formulaBody"></div>
  </aside>

<script>
'use strict';
const STORAGE_KEY = 'matheCoachV4State';
const THEME_KEY = 'matheCoachV4Theme';
const CHAPTERS = [
  {id:'basics', icon:'🧱', title:'Grundlagen', short:'Einheiten · Brüche · Dreisatz · Geometrie · Pythagoras · Kreis', desc:'Einheiten, Grundrechnen, Brüche, Dreisatz, Flächen, Pythagoras, Kreisrechnung, Volumen, Dichte und Materialkosten.'},
  {id:'stats', icon:'📊', title:'Statistik', short:'Mittelwert · Median · Spannweite', desc:'Messwerte sortieren, Mittelwert, Median, Spannweite und Ergebnisse interpretieren.'},
  {id:'linBasic', icon:'📈', title:'Lineare Funktionen – Grundlagen', short:'m · b · Punkte · Nullstellen', desc:'Funktionsgleichung, Steigung, y-Achsenabschnitt, Punktprobe, Nullstelle und Schnittpunkt.'},
  {id:'linUse', icon:'🏗️', title:'Lineare Funktionen – Sachaufgaben', short:'Tarife · Vorräte · Papier · Infusion', desc:'Sachaufgaben mit Funktionsgleichungen, Verbrauch, Kosten und Nullstellen.'}
];
const LEARN = [
  {chapter:'basics', title:'Einheiten umrechnen', terms:['mm','cm','m','g','kg','umrechnen'], formula:'m → cm: ·100 | cm → m: :100 | m → mm: ·1000 | kg → g: ·1000', text:'Bei Längeneinheiten gehst du Schritt für Schritt. Schreibe dir erst auf, ob du größer oder kleiner wirst.', steps:['Größere Einheit zu kleiner Einheit: mal rechnen.','Kleinere Einheit zu größerer Einheit: teilen.','Immer die Einheit hinter das Ergebnis schreiben.'], example:'2,5 m = 2,5 · 100 = 250 cm.'},
  {chapter:'basics', title:'Brüche addieren', terms:['Bruch','Nenner','Zähler','Hauptnenner'], formula:'gleicher Nenner: Zähler addieren | anderer Nenner: zuerst gleichnamig machen', text:'Bei Brüchen darfst du nur die Zähler addieren, wenn unten derselbe Nenner steht.', steps:['Prüfe: Sind die Nenner gleich?','Falls nein: Erweitere auf einen gemeinsamen Nenner.','Addiere oben die Zähler.','Kürze, wenn möglich.'], example:'1/2 + 1/3 = 3/6 + 2/6 = 5/6.'},
  {chapter:'basics', title:'Dreisatz proportional', terms:['Dreisatz','proportional','Preis','Menge'], formula:'erst auf 1 Stück / 1 m rechnen, dann auf die gesuchte Menge', text:'Proportional bedeutet: mehr Menge → mehr Preis. Verdoppelt sich die Menge, verdoppelt sich auch der Preis.', steps:['Teile durch die bekannte Menge.','Du hast jetzt den Wert für 1.','Multipliziere mit der gesuchten Menge.'], example:'50 Steckdosen kosten 250 €. 1 Stück = 5 €. 15 Stück = 75 €.'},
  {chapter:'basics', title:'Dreisatz antiproportional', terms:['antiproportional','Arbeiter','Zeit'], formula:'Anzahl · Zeit bleibt gleich', text:'Antiproportional bedeutet: mehr Arbeiter → weniger Zeit. Das Produkt bleibt gleich.', steps:['Multipliziere bekannte Anzahl mit bekannter Zeit.','Teile dieses Produkt durch die neue Anzahl.','Schreibe einen Antwortsatz.'], example:'4 Arbeiter · 15 Tage = 60. Bei 12 Arbeitern: 60 : 12 = 5 Tage.'},
  {chapter:'basics', title:'Flächen berechnen', terms:['Fläche','Rechteck','Dreieck','Kreis','m²'], formula:'Rechteck: a·b | Dreieck: g·h:2 | Kreis: π·r²', text:'Fläche ist zweidimensional. Die Einheit ist hier meistens m².', steps:['Erkenne die Form.','Setze die Werte in die passende Formel ein.','Rechne Schritt für Schritt.','Einheit m² angeben.'], example:'Dreieck: g=5 m, h=4 m → A=5·4:2=10 m².'},
  {chapter:'basics', title:'Volumen und Hohlkörper', terms:['Volumen','Quader','Zylinder','Prisma','Hohlkörper','m³'], formula:'Quader: a·b·h | Zylinder: π·r²·h | Hohlkörper: außen − innen', text:'Volumen ist dreidimensional. Die Einheit ist hier meistens m³.', steps:['Bestimme Außenkörper und Innenkörper.','Berechne das Volumen.','Bei Hohlkörpern: außen minus innen.'], example:'Außen 60 m³, innen 15 m³ → Materialvolumen 45 m³.'},
  {chapter:'basics', title:'Masse und Materialkosten', terms:['Dichte','Masse','Kosten','kg'], formula:'Masse = Volumen · Dichte | Kosten = Masse · Preis pro kg', text:'Bei Materialaufgaben rechnest du oft erst die Masse und danach den Preis.', steps:['Volumen und Dichte multiplizieren.','Die Masse in kg notieren.','Mit Preis pro kg multiplizieren.'], example:'2 m³ · 7 kg/m³ = 14 kg. 14 kg · 3 €/kg = 42 €.'},
  {chapter:'stats', title:'Mittelwert', terms:['Mittelwert','Durchschnitt','arithmetisches Mittel'], formula:'Mittelwert = Summe aller Werte : Anzahl der Werte', text:'Der Mittelwert ist der Durchschnitt. Ausreißer können ihn stark verändern.', steps:['Alle Werte addieren.','Zähle, wie viele Werte es sind.','Summe durch Anzahl teilen.'], example:'2, 4, 9 → Summe 15 → 15:3=5.'},
  {chapter:'stats', title:'Median', terms:['Median','Zentralwert','Mitte','sortieren'], formula:'ungerade Anzahl: mittlerer Wert | gerade Anzahl: Durchschnitt der zwei mittleren Werte', text:'Der Median ist die Mitte der sortierten Liste. Er ist oft besser, wenn es Ausreißer gibt.', steps:['Werte aufsteigend sortieren.','Die Mitte suchen.','Bei zwei mittleren Werten deren Mittelwert bilden.'], example:'2, 4, 6, 100 → Mitte: 4 und 6 → Median 5.'},
  {chapter:'stats', title:'Spannweite', terms:['Spannweite','Streuung','größter','kleinster'], formula:'Spannweite = größter Wert − kleinster Wert', text:'Die Spannweite zeigt, wie weit die Messwerte auseinanderliegen.', steps:['Kleinsten Wert finden.','Größten Wert finden.','Größten minus kleinsten Wert rechnen.'], example:'8, 10, 14 → 14−8=6.'},
  {chapter:'stats', title:'Interpretieren', terms:['Ausreißer','repräsentativ','Fertigungsqualität'], formula:'kleine Streuung = gleichmäßiger | große Streuung = ungleichmäßiger', text:'Interpretieren bedeutet: Die Zahl in einen sinnvollen Satz übersetzen.', steps:['Was bedeutet der Wert in der Situation?','Gibt es Ausreißer?','Passt Mittelwert oder Median besser?'], example:'Wenn eine Schraube stark abweicht, ist die Fertigungsqualität ungleichmäßiger.'},
  {chapter:'linBasic', title:'Was ist eine Funktion?', terms:['Funktion','Zuordnung','x','y'], formula:'jedem x-Wert wird genau ein y-Wert zugeordnet', text:'Eine Funktion ist wie eine eindeutige Maschine: Ein x geht rein, genau ein y kommt raus.', steps:['Prüfe den x-Wert.','Darf zu diesem x nur ein y gehören?','Wenn ja: Funktion.'], example:'Seitenlänge Quadrat → Umfang ist eine Funktion.'},
  {chapter:'linBasic', title:'Grundform linearer Funktionen', terms:['lineare Funktion','m','b','y-Achsenabschnitt','Steigung'], formula:'f(x)=m·x+b', text:'m ist die Steigung. b ist der y-Achsenabschnitt, also der Startwert bei x=0.', steps:['m erkennen oder berechnen.','b erkennen oder mit einem Punkt berechnen.','In f(x)=m·x+b einsetzen.'], example:'m=3, b=2 → f(x)=3x+2.'},
  {chapter:'linBasic', title:'Steigung aus zwei Punkten', terms:['Steigung','Punkt','m','Differenz'], formula:'m = (y₂−y₁) : (x₂−x₁)', text:'Die Steigung zeigt, wie stark y steigt oder fällt, wenn x größer wird.', steps:['y-Werte voneinander abziehen.','x-Werte voneinander abziehen.','y-Differenz durch x-Differenz teilen.'], example:'P(0|2), Q(1|5) → m=(5−2):(1−0)=3.'},
  {chapter:'linBasic', title:'Funktionswert und Punktprobe', terms:['f(x)','Funktionswert','Punktprobe'], formula:'P(a|b) liegt auf dem Graphen, wenn f(a)=b', text:'Bei der Punktprobe setzt du den x-Wert ein und vergleichst mit dem y-Wert.', steps:['x-Wert des Punktes nehmen.','In die Funktion einsetzen.','Ergebnis mit y-Wert vergleichen.'], example:'f(x)=3x+2, P(3|11): f(3)=11, also passt der Punkt.'},
  {chapter:'linBasic', title:'Nullstelle', terms:['Nullstelle','x-Achse','f(x)=0'], formula:'Nullstelle: f(x)=0 setzen', text:'Die Nullstelle ist die Stelle, an der der Graph die x-Achse schneidet.', steps:['Schreibe 0 = Funktion.','Löse die Gleichung nach x.','Antwort als x-Wert angeben.'], example:'0=2x−6 → 6=2x → x=3.'},
  {chapter:'linBasic', title:'Schnittpunkt zweier Geraden', terms:['Schnittpunkt','gleichsetzen','Geraden'], formula:'f(x)=g(x) setzen, dann x berechnen, danach y berechnen', text:'Beim Schnittpunkt haben beide Geraden denselben y-Wert.', steps:['Beide Gleichungen gleichsetzen.','Nach x auflösen.','x in eine Funktion einsetzen.','Schnittpunkt als S(x|y) schreiben.'], example:'2x+1=x+4 → x=3 → y=7 → S(3|7).'},
  {chapter:'linUse', title:'Temperaturen umrechnen', terms:['Celsius','Fahrenheit','lineare Funktion'], formula:'F(x)=1,8x+32', text:'Celsius in Fahrenheit ist eine lineare Funktion. x steht für °C.', steps:['Celsius-Wert für x einsetzen.','Mit 1,8 multiplizieren.','32 addieren.'], example:'20 °C → 1,8·20+32=68 °F.'},
  {chapter:'linUse', title:'Tarif-Aufgaben', terms:['Tarif','Grundgebühr','Cent','Euro','Kostenfunktion'], formula:'K(x)=Preis pro Minute · x + Grundgebühr', text:'Achte besonders auf Cent und Euro. 1,30 Cent sind 0,013 €.', steps:['Variable festlegen: x = Minuten.','Cent in Euro umrechnen.','Grundgebühr als b addieren.','Für einen Wert x einsetzen.'], example:'Tarif B: 5 € + 0,30 Cent/min → K(x)=0,003x+5.'},
  {chapter:'linUse', title:'Verbrauch / Vorräte', terms:['Verbrauch','Vorrat','Nullstelle','leer'], formula:'Rest(t)=Start − Verbrauch pro Zeit · t', text:'Wenn etwas verbraucht wird, ist die Steigung negativ. Leer bedeutet Nullstelle.', steps:['Startwert als b nehmen.','Verbrauch pro Tag/Woche als negative Steigung nehmen.','Zum Leer-Zeitpunkt f(t)=0 setzen.'], example:'Milch: M(t)=48−1,5t → leer bei t=32 Tagen.'},
  {chapter:'linUse', title:'Parallel und senkrecht', terms:['parallel','senkrecht','Steigung'], formula:'parallel: gleiche Steigung | senkrecht: m₁·m₂ = −1', text:'Parallele Geraden steigen gleich. Senkrechte Geraden haben negative Kehrwert-Steigungen.', steps:['Bei parallel: m übernehmen.','Bei senkrecht: negativen Kehrwert bilden.','b mit Punkt oder Achsenschnitt bestimmen.'], example:'parallel zu y=2x−3 durch P(5|4): 4=2·5+b → b=−6.'}
,
  {chapter:'basics', title:'Einheiten nur mm, cm, m und m²/m³', terms:['Einheiten','m²','m³','mm','cm','m'], formula:'Länge: mm ↔ cm ↔ m | Fläche: meistens m² | Volumen: meistens m³', text:'Bei deinem Thema bleiben die Flächen und Volumen meist in m² und m³. Nicht hektisch cm² oder cm³ verwenden, wenn die Aufgabe es nicht verlangt.', steps:['Markiere die gegebene Einheit.','Rechne Längen zuerst in m um, wenn später m² oder m³ gefragt ist.','Erst dann Fläche oder Volumen berechnen.'], example:'250 cm = 2,5 m. Fläche mit 4 m Breite: 2,5·4=10 m².'},
  {chapter:'basics', title:'Runden ohne Chaos', terms:['runden','Zwischenergebnis','Einheit'], formula:'Zwischenwerte lieber genauer lassen | Endergebnis sinnvoll runden', text:'Wenn du zu früh rundest, kann das Endergebnis falscher werden. Schreibe lieber 2–3 Nachkommastellen hin und runde am Ende.', steps:['Rechne mit dem Taschenrechner genau weiter.','Notiere ein Zwischenergebnis mit ca. 2–3 Nachkommastellen.','Runde erst im Antwortsatz passend.'], example:'9,333… cm³/min wird am Ende zu ca. 9,33 cm³/min.'},
  {chapter:'stats', title:'Fake-Statistik: abgeschnittene y-Achse', terms:['Fake Statistik','Diagramm','y-Achse','manipuliert','Balkendiagramm'], formula:'Prüfe: Startet die y-Achse bei 0?', text:'Wenn die y-Achse nicht bei 0 startet, sehen kleine Unterschiede oft riesig aus. Das ist nicht immer verboten, aber man muss es klar erkennen.', steps:['Suche die y-Achse.','Prüfe den Startwert.','Vergleiche die echten Zahlen, nicht nur die Balkenhöhe.'], example:'95 % und 98 % Unterschied sind nur 3 Prozentpunkte, können aber im Diagramm riesig aussehen.'},
  {chapter:'stats', title:'Prozentpunkte vs. Prozent', terms:['Prozentpunkte','Prozent','Steigerung'], formula:'von 20 % auf 25 % = +5 Prozentpunkte, aber +25 % relativ', text:'Prozentpunkte sind der direkte Abstand zwischen Prozentwerten. Prozent ist eine relative Änderung im Vergleich zum Anfang.', steps:['Ziehe die Prozentwerte direkt ab → Prozentpunkte.','Für relative Prozent: Unterschied durch Startwert teilen.','Antwortsatz genau formulieren.'], example:'20 % → 25 %: 25−20=5 Prozentpunkte. 5:20=0,25 = 25 % relative Steigerung.'},
  {chapter:'stats', title:'Stichprobe und Aussagekraft', terms:['Stichprobe','repräsentativ','Umfrage','n'], formula:'kleine/unsichere Stichprobe = vorsichtig interpretieren', text:'Eine Statistik wirkt seriös, kann aber schwach sein, wenn nur sehr wenige Personen befragt wurden oder die Auswahl unfair war.', steps:['Suche die Anzahl n.','Frage: Wer wurde befragt?','Prüfe, ob die Gruppe zur Aussage passt.'], example:'5 Freunde zu Lieblingsessen zu befragen sagt nicht sicher etwas über die ganze Schule.'},
  {chapter:'stats', title:'Cherry Picking', terms:['Cherry Picking','Zeitraum','Auswahl','Trend'], formula:'anderer Zeitraum = manchmal andere Aussage', text:'Cherry Picking bedeutet: Man wählt nur den Zeitraum oder die Werte aus, die zur gewünschten Aussage passen.', steps:['Prüfe den Zeitraum.','Frage: Warum genau diese Jahre/Monate?','Suche, ob davor oder danach etwas Wichtiges fehlt.'], example:'Nur den besten Monat zu zeigen, lässt einen Betrieb besser aussehen als der Jahresdurchschnitt.'},
  {chapter:'stats', title:'Korrelation ist nicht automatisch Ursache', terms:['Korrelation','Ursache','Zusammenhang'], formula:'Zusammenhang ≠ Beweis für Ursache', text:'Wenn zwei Werte gemeinsam steigen, heißt das nicht automatisch, dass einer den anderen verursacht.', steps:['Formuliere nur: Es gibt einen Zusammenhang.','Behaupte Ursache nur mit Begründung.','Denke an dritte Faktoren.'], example:'Mehr Eisverkäufe und mehr Sonnenbrände hängen zusammen, aber Eis verursacht keine Sonnenbrände.'},
  {chapter:'linBasic', title:'Graphen lesen: m und b', terms:['Graph','Steigung','y-Achsenabschnitt','m','b'], formula:'b liest du bei x=0 ab | m = hoch/runter pro Schritt nach rechts', text:'Beim Graphen musst du nicht sofort rechnen. Suche zuerst den Schnitt mit der y-Achse und dann ein Steigungsdreieck.', steps:['Schnittpunkt mit der y-Achse finden → b.','Von einem Gitterpunkt zum nächsten gehen.','hoch/runter durch rechts zählen → m.'], example:'Von (0|1) nach (2|5): hoch 4, rechts 2 → m=2, b=1.'},
  {chapter:'linBasic', title:'Interaktiver Graphen-Check', terms:['interaktiv','Graph einstellen','m','b'], formula:'Schieberegler: m verändert die Schräge, b verschiebt nach oben/unten', text:'Wenn du eine Gerade einstellen sollst, ändere zuerst b und danach m. So wird es übersichtlicher.', steps:['b einstellen: Wo schneidet die Gerade die y-Achse?','m einstellen: steigt oder fällt die Gerade?','Mit einem zweiten Punkt kontrollieren.'], example:'y=2x+1: b=1, pro 1 nach rechts geht die Gerade 2 nach oben.'},
  {chapter:'linBasic', title:'Nullstelle aus dem Graphen', terms:['Nullstelle','Graph','x-Achse'], formula:'Nullstelle = x-Wert bei y=0', text:'Die Nullstelle liest du dort ab, wo die Gerade die x-Achse trifft. Du brauchst dabei den x-Wert, nicht den y-Wert.', steps:['Suche die x-Achse.','Finde den Schnittpunkt mit der Geraden.','Lies den x-Wert ab.'], example:'Bei y=x+2 schneidet die Gerade die x-Achse bei x=−2.'},
  {chapter:'linUse', title:'Graphen in Sachaufgaben', terms:['Sachaufgabe','Graph','Startwert','Verbrauch','Kosten'], formula:'Startwert = y-Achsenabschnitt | Verbrauch = negative Steigung | Kosten = positive Steigung', text:'Bei Sachaufgaben zeigt der Graph oft Vorrat, Kosten oder Temperatur. Die Achsen verraten, was x und y bedeuten.', steps:['Achsen lesen: Was ist x? Was ist y?','Startwert bei x=0 ablesen.','Steigung als Änderung pro Einheit deuten.'], example:'Rest(t)=48−1,5t: Start 48 Liter, pro Tag 1,5 Liter weniger.'}
,
  {chapter:'basics', title:'Satz des Pythagoras', terms:['Pythagoras','rechtwinklig','Kathete','Hypotenuse','a²+b²=c²'], formula:'a² + b² = c²', text:'Der Satz des Pythagoras gilt nur im rechtwinkligen Dreieck. c ist die längste Seite und liegt gegenüber vom rechten Winkel.', steps:['Prüfe: Ist ein rechter Winkel gegeben?','Markiere die längste Seite als c.','Setze in a²+b²=c² ein.','Wenn eine Seite gesucht ist: am Ende die Wurzel ziehen.','Antwortsatz mit Einheit schreiben.'], example:'a=3 m, b=4 m → c²=3²+4²=9+16=25 → c=5 m.'},
  {chapter:'basics', title:'Pythagoras: Kathete berechnen', terms:['Pythagoras','Kathete','Wurzel','c²-a²'], formula:'a² = c² − b² | b² = c² − a²', text:'Wenn die Hypotenuse c und eine Kathete gegeben sind, rechnest du minus. Wichtig: Erst quadrieren, dann abziehen, dann Wurzel ziehen.', steps:['c erkennen: längste Seite gegenüber vom rechten Winkel.','Die bekannte Kathete quadrieren.','c² minus bekannte Kathete² rechnen.','Wurzel ziehen.'], example:'c=13 m, b=5 m → a²=13²−5²=169−25=144 → a=12 m.'},
  {chapter:'basics', title:'Kreisrechnung', terms:['Kreis','Radius','Durchmesser','Umfang','Fläche','π'], formula:'d=2r | U=2πr oder U=πd | A=πr²', text:'Beim Kreis musst du zuerst erkennen, ob Radius r oder Durchmesser d gegeben ist. Der Radius ist die Hälfte vom Durchmesser.', steps:['Aufgabe lesen: Ist r oder d gegeben?','Falls d gegeben ist: r=d:2.','Für Umfang U die Randlänge berechnen.','Für Fläche A den Inhalt berechnen.','Sinnvoll runden, z. B. auf 2 Nachkommastellen.'], example:'r=2 m → U=2·π·2≈12,57 m und A=π·2²≈12,57 m².'},
  {chapter:'basics', title:'Rechteck: a mal b', terms:['Rechteck','a·b','Fläche','Textaufgabe','m²'], formula:'A = a · b', text:'Bei Rechtecken ist a eine Seitenlänge und b die andere Seitenlänge. Fläche bedeutet: Wie viel Platz liegt innen?', steps:['Länge a markieren.','Breite b markieren.','A=a·b aufschreiben.','Zahlen einsetzen und m² als Einheit angeben.'], example:'Ein Beet ist 6 m lang und 4 m breit → A=6·4=24 m².'},
  {chapter:'basics', title:'Textaufgaben: Rechenweg aufstellen', terms:['Rechenweg','Textaufgabe','gegeben','gesucht','Antwortsatz'], formula:'Gegeben → Gesucht → Formel → Einsetzen → Rechnen → Antwortsatz', text:'Wenn eine Textaufgabe schwer wirkt, musst du nicht sofort rechnen. Schreibe zuerst den Plan auf.', steps:['Gegebene Zahlen mit Einheit markieren.','Gesuchte Größe notieren.','Passende Formel auswählen.','Zahlen in die Formel einsetzen.','Ergebnis prüfen: Einheit und Antwortsatz.'], example:'Gegeben: a=8 m, b=3 m. Gesucht: A. Formel: A=a·b. Rechnung: A=8·3=24 m².'},
  {chapter:'stats', title:'Statistik beschreiben', terms:['Statistik beschreiben','Diagramm','höchster Wert','niedrigster Wert','Trend'], formula:'Beschreibung = Was sieht man? + Zahlenbeleg + Bedeutung', text:'Bei Statistik-Beschreibungen sollst du neutral erklären, was die Daten zeigen. Nicht übertreiben, sondern mit Zahlen belegen.', steps:['Thema und Einheit nennen.','Höchsten und niedrigsten Wert nennen.','Auffälligkeiten oder Trend beschreiben.','Mit einem Satz interpretieren.'], example:'Die Fehlerzahl sinkt von 12 auf 6. Das spricht für eine Verbesserung, weil es halb so viele Fehler sind.'},
  {chapter:'linBasic', title:'Rechenweg bei linearen Funktionen aufstellen', terms:['Rechenweg','lineare Funktion','m','b','Textaufgabe'], formula:'1. x festlegen | 2. Startwert b | 3. Änderung m | 4. f(x)=m·x+b', text:'Bei Textaufgaben zu linearen Funktionen brauchst du zuerst eine klare Bedeutung für x und y.', steps:['Lege fest, was x bedeutet.','Suche den Startwert: Das ist b.','Suche die Änderung pro Schritt: Das ist m.','Schreibe die Funktionsgleichung.','Setze Werte ein oder berechne die Nullstelle.'], example:'Taxi: 4 € Start + 2 €/km → x=km, K(x)=2x+4.'}

  {id:'s05', chapter:'stats', type:'input', numeric:true, answer:5, sub:'Median', prompt:'Bestimme den Median: 2, 4, 6, 100', hint:'Bei gerader Anzahl nimmst du die zwei mittleren Werte.', explanation:'Die Mitte ist 4 und 6. (4+6):2=5.'},

  {id:'s07', chapter:'stats', type:'choice', answer:1, sub:'Median', prompt:'Warum ist der Median bei Ausreißern oft sinnvoll?', options:['Er wird immer größer als der Mittelwert.','Er wird durch einzelne extreme Werte weniger verzerrt.','Er braucht keine sortierte Liste.'], hint:'Denke an einen sehr großen Einzelwert.', explanation:'Der Median liegt in der Mitte und wird durch einzelne Ausreißer weniger stark beeinflusst.'},
  {id:'s08', chapter:'stats', type:'input', numeric:true, answer:23.5, sub:'Median', prompt:'Mädchen-Punkte: 14,17,18,20,20,23,23,24,26,27,29,30,32,33. Bestimme den Median.', hint:'14 Werte: nimm den 7. und 8. Wert und bilde den Durchschnitt.', explanation:'7. Wert=23, 8. Wert=24. (23+24):2=23,5.'},
  {id:'s09', chapter:'stats', type:'input', numeric:true, answer:15, sub:'Spannweite', prompt:'Mädchen-Punkte: kleinster Wert 14, größter Wert 33. Berechne die Spannweite.', hint:'Größter minus kleinster Wert.', explanation:'33−14=19. Achtung: 15 wäre nicht richtig.', altWrong:'15'},
  {id:'s10', chapter:'stats', type:'input', numeric:true, answer:19, sub:'Spannweite', prompt:'Jungen-Punkte: kleinster Wert 15, größter Wert 34. Berechne die Spannweite.', hint:'Größter minus kleinster Wert.', explanation:'34−15=19.'},
  {id:'s11', chapter:'stats', type:'order', answer:[20,22.5,50,150,2000], items:[2000,22.5,50,150,20], sub:'Sortieren', prompt:'Sortiere aufsteigend: 2000, 22,5, 50, 150, 20', hint:'22,5 liegt zwischen 20 und 50.', explanation:'Aufsteigend: 20, 22,5, 50, 150, 2000.'},
  {id:'s12', chapter:'stats', type:'choice', answer:0, sub:'Interpretation', prompt:'Werte: 20, 22,5, 50, 150, 2000. Was ist auffällig?', options:['2000 ist ein starker Ausreißer.','Alle Werte sind fast gleich.','Der Median kann nicht bestimmt werden.'], hint:'Ein Wert ist viel größer als alle anderen.', explanation:'2000 ist ein starker Ausreißer und zieht den Mittelwert stark nach oben.'},
  {id:'s13', chapter:'stats', type:'multi', answer:[0,2], sub:'Interpretation', prompt:'Welche Aussagen sind richtig? Wähle alle passenden Antworten.', options:['Median ist gut bei Ausreißern.','Spannweite = kleinster Wert + größter Wert.','Mittelwert heißt auch Durchschnitt.'], hint:'Eine Aussage enthält eine falsche Formel.', explanation:'Median ist robust gegen Ausreißer. Mittelwert heißt Durchschnitt. Spannweite = größter−kleinster Wert.'},
  {id:'s14', chapter:'stats', type:'input', numeric:true, answer:65, sub:'Median', prompt:'Bestimme den Median der Gewichte: 55, 65, 83, 92, 45', hint:'Erst sortieren.', explanation:'Sortiert: 45,55,65,83,92. Die Mitte ist 65.'},
  {id:'s15', chapter:'stats', type:'input', numeric:true, answer:68, sub:'Mittelwert', prompt:'Berechne den Mittelwert: 55, 65, 83, 92, 45', hint:'Addieren, dann durch 5 teilen.', explanation:'55+65+83+92+45=340. 340:5=68.'},
  {id:'s16', chapter:'stats', type:'choice', answer:2, sub:'Fertigungsqualität', prompt:'Welche Interpretation passt, wenn die Spannweite sehr klein ist?', options:['Die Werte sind egal.','Die Qualität ist sicher schlecht.','Die Messwerte liegen nah beieinander; die Fertigung wirkt gleichmäßig.'], hint:'Kleine Spannweite bedeutet wenig Streuung.', explanation:'Eine kleine Spannweite bedeutet, dass die Werte nah beieinanderliegen.'},
  {id:'l01', chapter:'linBasic', type:'choice', answer:0, sub:'Funktion', prompt:'Was ist eine Funktion?', options:['Jedem x-Wert wird genau ein y-Wert zugeordnet.','Jedem x-Wert werden immer zwei y-Werte zugeordnet.','Eine Funktion darf keine Gerade sein.'], hint:'Achte auf: genau ein y pro x.', explanation:'Eine Funktion ordnet jedem x-Wert genau einen y-Wert zu.'},
  {id:'l02', chapter:'linBasic', type:'choice', answer:1, sub:'Funktion', prompt:'Welche Zuordnung ist sicher eine Funktion?', options:['Person → Telefonnummer, wenn eine Person mehrere Nummern haben kann.','Seitenlänge eines Quadrats → Umfang.','Name → Körpergröße, wenn mehrere Personen gleich heißen.'], hint:'Zu einem x darf nur ein y gehören.', explanation:'Jede Seitenlänge eines Quadrats hat genau einen Umfang.'},
  {id:'l03', chapter:'linBasic', type:'input', textAnswers:['f(x)=3x+2','y=3x+2','3x+2'], sub:'Grundform', prompt:'m=3 und b=2. Gib die Funktionsgleichung an.', hint:'Grundform: f(x)=m·x+b.', explanation:'f(x)=3x+2.'},
  {id:'l04', chapter:'linBasic', type:'input', numeric:true, answer:3, sub:'Steigung', prompt:'Bestimme die Steigung von f(x)=3x+2.', hint:'In f(x)=m·x+b ist m die Steigung.', explanation:'m=3.'},
  {id:'l05', chapter:'linBasic', type:'input', numeric:true, answer:2, sub:'y-Achsenabschnitt', prompt:'Bestimme den y-Achsenabschnitt von f(x)=3x+2.', hint:'In f(x)=m·x+b ist b der y-Achsenabschnitt.', explanation:'b=2.'},
  {id:'l06', chapter:'linBasic', type:'input', numeric:true, answer:11, sub:'Funktionswert', prompt:'Berechne f(3) für f(x)=3x+2.', hint:'Setze x=3 ein.', explanation:'f(3)=3·3+2=11.'},
  {id:'l07', chapter:'linBasic', type:'choice', answer:0, sub:'Punktprobe', prompt:'Liegt P(3|11) auf f(x)=3x+2?', options:['Ja','Nein'], hint:'Setze x=3 ein und vergleiche mit 11.', explanation:'f(3)=11. Der Punkt liegt auf dem Graphen.'},
  {id:'l08', chapter:'linBasic', type:'input', numeric:true, answer:3, sub:'Steigung aus Punkten', prompt:'Berechne die Steigung durch P(0|2) und Q(1|5).', hint:'m=(y₂−y₁):(x₂−x₁).', explanation:'m=(5−2):(1−0)=3.'},
  {id:'l09', chapter:'linBasic', type:'input', numeric:true, answer:2, sub:'Steigung aus Punkten', prompt:'Berechne die Steigung durch P(2|4) und Q(5|10).', hint:'y-Differenz durch x-Differenz.', explanation:'m=(10−4):(5−2)=6:3=2.'},
  {id:'l10', chapter:'linBasic', type:'input', textAnswers:['f(x)=2x','y=2x','2x'], sub:'Gleichung aus Punkten', prompt:'Bestimme die Gerade durch P(0|0) und Q(3|6).', hint:'Steigung = 6:3. b=0.', explanation:'m=2 und b=0. Also f(x)=2x.'},
  {id:'l11', chapter:'linBasic', type:'input', textAnswers:['f(x)=3x+2','y=3x+2','3x+2'], sub:'Gleichung aus Punkten', prompt:'Bestimme die Funktionsgleichung durch P(0|2) und Q(1|5).', hint:'Bei P(0|2) kannst du b direkt sehen.', explanation:'m=(5−2):(1−0)=3 und b=2. Also f(x)=3x+2.'},
  {id:'l12', chapter:'linBasic', type:'input', numeric:true, answer:3, sub:'Nullstelle', prompt:'Berechne die Nullstelle von f(x)=2x−6.', hint:'Setze f(x)=0.', explanation:'0=2x−6 → 6=2x → x=3.'},
  {id:'l13', chapter:'linBasic', type:'input', numeric:true, answer:-2, sub:'Nullstelle', prompt:'Berechne die Nullstelle von f(x)=x+2.', hint:'Setze y=0.', explanation:'0=x+2 → x=−2.'},
  {id:'l14', chapter:'linBasic', type:'input', numeric:true, answer:3, sub:'Schnittpunkt', prompt:'Löse den x-Wert: 2x+1 = x+4', hint:'Bringe alle x auf eine Seite.', explanation:'2x+1=x+4 → x=3.'},
  {id:'l15', chapter:'linBasic', type:'input', numeric:true, answer:7, sub:'Schnittpunkt', prompt:'Beim Schnittpunkt gilt x=3. Berechne y bei f(x)=2x+1.', hint:'Setze x=3 ein.', explanation:'y=2·3+1=7.'},
  {id:'l16', chapter:'linBasic', type:'input', textAnswers:['S(3|7)','(3|7)','3|7'], sub:'Schnittpunkt', prompt:'Schreibe den Schnittpunkt mit x=3 und y=7.', hint:'Schnittpunkt schreibt man oft als S(x|y).', explanation:'Der Schnittpunkt ist S(3|7).'},
  {id:'l17', chapter:'linBasic', type:'choice', answer:1, sub:'Graph', prompt:'Was bedeutet b in f(x)=m·x+b?', options:['Die Nullstelle.','Der y-Achsenabschnitt.','Die x-Achse.'], hint:'b ist der Wert bei x=0.', explanation:'b ist der y-Achsenabschnitt.'},
  {id:'l18', chapter:'linBasic', type:'choice', answer:0, sub:'Graph', prompt:'Was bedeutet eine negative Steigung?', options:['Die Gerade fällt von links nach rechts.','Die Gerade steigt von links nach rechts.','Die Gerade ist immer waagerecht.'], hint:'Minus: Wenn x größer wird, wird y kleiner.', explanation:'Eine negative Steigung bedeutet: Die Gerade fällt.'},
  {id:'l19', chapter:'linBasic', type:'input', textAnswers:['f(3)=12'], sub:'Kurzschreibweise', prompt:'Formuliere kurz: An der Stelle 3 hat f den Funktionswert 12.', hint:'Funktionswert an der Stelle x schreibt man f(x).', explanation:'Kurzschreibweise: f(3)=12.'},
  {id:'l20', chapter:'linBasic', type:'input', textAnswers:['f(2)=5'], sub:'Kurzschreibweise', prompt:'P(2|5) liegt auf dem Graphen von f. Welche Rechnung passt dazu?', hint:'x=2, y=5.', explanation:'Passend ist f(2)=5.'},
  {id:'l21', chapter:'linBasic', type:'input', textAnswers:['f(x)=2x-6','y=2x-6','2x-6'], sub:'Parallel', prompt:'Gerade parallel zu y=2x−3 durch P(5|4). Bestimme die Gleichung.', hint:'Parallel bedeutet gleiche Steigung m=2.', explanation:'4=2·5+b → b=−6. Also f(x)=2x−6.'},
  {id:'l22', chapter:'linBasic', type:'input', textAnswers:['f(x)=-0,2x-9','f(x)=-0.2x-9','f(x)=-1/5x-9','y=-0,2x-9','y=-0.2x-9','y=-1/5x-9'], sub:'Senkrecht', prompt:'Gerade senkrecht zu g(x)=5x+7 und y-Achsenabschnitt −9. Gib die Gleichung an.', hint:'Senkrechte Steigung zu 5 ist −1/5.', explanation:'m=−1/5=−0,2 und b=−9. Also f(x)=−0,2x−9.'},
  {id:'u01', chapter:'linUse', type:'input', textAnswers:['F(x)=1,8x+32','F(x)=1.8x+32','y=1,8x+32','y=1.8x+32','1,8x+32','1.8x+32'], sub:'Temperatur', prompt:'Stelle die Umrechnung von °C in °F als Funktion auf. Nutze x für °C.', hint:'Erst mit 1,8 multiplizieren, dann 32 addieren.', explanation:'F(x)=1,8x+32.'},
  {id:'u02', chapter:'linUse', type:'input', numeric:true, answer:32, unit:'°F', sub:'Temperatur', prompt:'Berechne F(0) bei F(x)=1,8x+32.', hint:'Setze x=0 ein.', explanation:'F(0)=1,8·0+32=32 °F.'},
  {id:'u03', chapter:'linUse', type:'input', numeric:true, answer:68, unit:'°F', sub:'Temperatur', prompt:'Berechne F(20) bei F(x)=1,8x+32.', hint:'1,8·20, danach +32.', explanation:'1,8·20=36. 36+32=68 °F.'},
  {id:'u04', chapter:'linUse', type:'input', textAnswers:['K(x)=0,013x','y=0,013x','0,013x','K(x)=0.013x','0.013x'], sub:'Tarife', prompt:'Tarif A: keine Grundgebühr, 1,30 Cent pro Minute. Gib die Kostenfunktion in Euro an.', hint:'1,30 Cent = 0,013 Euro.', explanation:'K(x)=0,013x.'},
  {id:'u05', chapter:'linUse', type:'input', textAnswers:['K(x)=0,003x+5','y=0,003x+5','0,003x+5','K(x)=0.003x+5','0.003x+5'], sub:'Tarife', prompt:'Tarif B: 5 € Grundgebühr, 0,30 Cent pro Minute. Gib die Kostenfunktion in Euro an.', hint:'0,30 Cent = 0,003 Euro. Grundgebühr ist b.', explanation:'K(x)=0,003x+5.'},
  {id:'u06', chapter:'linUse', type:'input', numeric:true, answer:20, unit:'€', mustUnit:true, sub:'Tarife', prompt:'Tarif C ist eine Flatrate für 20 €. Kosten bei 510 Minuten?', hint:'Flatrate bleibt gleich.', explanation:'Bei einer Flatrate bleiben die Kosten 20 €.'},
  {id:'u07', chapter:'linUse', type:'input', numeric:true, answer:6.63, unit:'€', tolerance:0.01, mustUnit:true, sub:'Tarife', prompt:'Tarif A: 0,013 € pro Minute. Berechne die Kosten für 510 Minuten.', hint:'510 · 0,013.', explanation:'510·0,013=6,63 €.'},
  {id:'u08', chapter:'linUse', type:'input', numeric:true, answer:6.53, unit:'€', tolerance:0.01, mustUnit:true, sub:'Tarife', prompt:'Tarif B: K(x)=0,003x+5. Berechne K(510).', hint:'Erst 0,003·510, dann +5.', explanation:'0,003·510=1,53. 1,53+5=6,53 €.'},
  {id:'u09', chapter:'linUse', type:'input', numeric:true, answer:-2.2, tolerance:0.01, sub:'Papier', prompt:'Umweltpapier: KW 10 = 22 Pakete, KW 15 = 11 Pakete. Berechne die Steigung pro Woche.', hint:'m=(11−22):(15−10).', explanation:'m=−11:5=−2,2 Pakete pro Woche.'},
  {id:'u10', chapter:'linUse', type:'input', textAnswers:['P(x)=-2,2x+44','P(x)=-2.2x+44','y=-2,2x+44','y=-2.2x+44','-2,2x+44','-2.2x+44'], sub:'Papier', prompt:'Umweltpapier hat m=−2,2 und bei KW 10 noch 22 Pakete. Bestimme P(x).', hint:'Setze x=10 und y=22 ein.', explanation:'22=−2,2·10+b → 22=−22+b → b=44. P(x)=−2,2x+44.'},
  {id:'u11', chapter:'linUse', type:'input', numeric:true, answer:20, sub:'Papier', prompt:'Wann ist P(x)=−2,2x+44 aufgebraucht?', hint:'Setze P(x)=0.', explanation:'0=−2,2x+44 → 2,2x=44 → x=20.'},
  {id:'u12', chapter:'linUse', type:'input', numeric:true, answer:-280, unit:'cm³', sub:'Infusion', prompt:'Infusion: Nach 30 min 1250 cm³, nach 60 min 970 cm³. Änderung in 30 Minuten?', hint:'970−1250.', explanation:'970−1250=−280 cm³.'},
  {id:'u13', chapter:'linUse', type:'input', numeric:true, answer:-9.33, tolerance:0.03, sub:'Infusion', prompt:'Infusion: −280 cm³ in 30 Minuten. Berechne die Steigung pro Minute.', hint:'−280 durch 30 teilen.', explanation:'−280:30≈−9,33 cm³ pro Minute.'},
  {id:'u14', chapter:'linUse', type:'input', textAnswers:['h(t)=33-1,5t','h(t)=33-1.5t','h(t)=-1,5t+33','h(t)=-1.5t+33','y=33-1,5t','y=33-1.5t'], sub:'Kerze', prompt:'Kerze: 33 cm hoch, pro Stunde 1,5 cm kürzer. Gib h(t) an.', hint:'Startwert 33, jede Stunde minus 1,5.', explanation:'h(t)=33−1,5t.'},
  {id:'u15', chapter:'linUse', type:'input', numeric:true, answer:22, unit:'h', sub:'Kerze', prompt:'Kerze: h(t)=33−1,5t. Wann ist sie abgebrannt?', hint:'Setze h(t)=0.', explanation:'0=33−1,5t → t=22 Stunden.'},
  {id:'u16', chapter:'linUse', type:'input', textAnswers:['M(t)=48-1,5t','M(t)=48-1.5t','M(t)=-1,5t+48','M(t)=-1.5t+48','y=48-1,5t','48-1,5t'], sub:'Vorräte', prompt:'Milchvorrat: 48 Liter, Verbrauch 1,5 Liter pro Tag. Stelle M(t) auf.', hint:'Startwert minus Verbrauch pro Tag mal t.', explanation:'M(t)=48−1,5t.'},
  {id:'u17', chapter:'linUse', type:'input', numeric:true, answer:32, unit:'Tage', sub:'Vorräte', prompt:'Milchvorrat M(t)=48−1,5t. Nach wie vielen Tagen ist die Milch leer?', hint:'Setze M(t)=0.', explanation:'0=48−1,5t → t=32 Tage.'},
  {id:'u18', chapter:'linUse', type:'input', textAnswers:['K(t)=10-0,5t','K(t)=10-0.5t','K(t)=-0,5t+10','K(t)=-0.5t+10','y=10-0,5t','10-0,5t'], sub:'Vorräte', prompt:'Kaffeevorrat: 10 Packungen, Verbrauch 0,5 Packungen pro Tag. Stelle K(t) auf.', hint:'Startwert minus Verbrauch pro Tag mal t.', explanation:'K(t)=10−0,5t.'},
  {id:'u19', chapter:'linUse', type:'input', numeric:true, answer:20, unit:'Tage', sub:'Vorräte', prompt:'Kaffeevorrat K(t)=10−0,5t. Nach wie vielen Tagen ist Kaffee leer?', hint:'Setze K(t)=0.', explanation:'0=10−0,5t → t=20 Tage.'},
  {id:'u20', chapter:'linUse', type:'input', numeric:true, answer:30, unit:'Liter', sub:'Vorräte', prompt:'Wie viel Milch müsste man kaufen, damit sie bei 1,5 L/Tag nach 20 Tagen leer ist?', hint:'Verbrauch pro Tag mal Tage.', explanation:'1,5·20=30 Liter.'},
  {id:'u21', chapter:'linUse', type:'input', numeric:true, answer:52.25, tolerance:0.02, sub:'Cheops', prompt:'f₁(x)=14/11x+80 und f₂(x)=−14/11x+213. Berechne den x-Wert des Schnittpunkts.', hint:'Setze f₁(x)=f₂(x).', explanation:'14/11x+80=−14/11x+213 → 28/11x=133 → x=52,25.'},
  {id:'u22', chapter:'linUse', type:'input', numeric:true, answer:146.5, unit:'m', tolerance:0.1, sub:'Cheops', prompt:'Cheops: x=52,25. Berechne die Höhe mit f₁(x)=14/11x+80.', hint:'Setze 52,25 für x ein.', explanation:'14/11·52,25+80=146,5 m.'}
,
  {id:'s17', chapter:'stats', type:'choice', answer:1, sub:'Fake-Statistik', prompt:'Ein Balkendiagramm zeigt 95 % und 98 %. Die y-Achse beginnt aber erst bei 90 %. Was ist daran problematisch?', options:['Es ist immer falsch, Prozentwerte zu zeigen.','Der Unterschied wirkt optisch viel größer als er in Zahlen ist.','95 % ist größer als 98 %.'], hint:'Achte auf den Start der y-Achse.', explanation:'Bei abgeschnittener y-Achse wirken 3 Prozentpunkte Unterschied oft riesig.', chart:{title:'Abgeschnittene y-Achse: kleine Differenz wirkt riesig', yMin:90, yMax:100, values:[{label:'A',value:95},{label:'B',value:98}], warn:'Achtung: y-Achse startet bei 90, nicht bei 0.'}},
  {id:'s18', chapter:'stats', type:'input', numeric:true, answer:3, unit:'Prozentpunkte', sub:'Prozentpunkte', prompt:'Eine Quote steigt von 95 % auf 98 %. Um wie viele Prozentpunkte steigt sie?', hint:'Prozentpunkte: einfach 98−95 rechnen.', explanation:'98 % − 95 % = 3 Prozentpunkte.'},
  {id:'s19', chapter:'stats', type:'choice', answer:0, sub:'Prozent vs. Prozentpunkte', prompt:'Eine Fehlerquote steigt von 2 % auf 4 %. Welche Aussage ist mathematisch richtig?', options:['Sie steigt um 2 Prozentpunkte und relativ um 100 %.','Sie steigt um 100 Prozentpunkte.','Sie fällt um 2 Prozentpunkte.'], hint:'Prozentpunkte sind der direkte Abstand. Relativ vergleichst du mit dem Startwert 2 %.', explanation:'4−2=2 Prozentpunkte. Relativ ist die Quote doppelt so hoch, also +100 %.'},
  {id:'s20', chapter:'stats', type:'choice', answer:2, sub:'Stichprobe', prompt:'Eine Umfrage fragt nur 5 Freunde nach ihrer Lieblingsmarke und schreibt: „Alle Jugendlichen lieben Marke X“. Was ist das Problem?', options:['Der Median fehlt immer.','Man darf keine Umfragen machen.','Die Stichprobe ist zu klein und nicht repräsentativ.'], hint:'Überlege, ob 5 Freunde für alle Jugendlichen stehen können.', explanation:'Eine kleine, einseitige Stichprobe kann keine sichere Aussage über alle Jugendlichen machen.'},
  {id:'s21', chapter:'stats', type:'multi', answer:[0,2,3], sub:'Diagramme prüfen', prompt:'Welche Dinge solltest du bei einem Diagramm prüfen? Wähle alle richtigen Antworten.', options:['Startet die y-Achse bei 0 oder ist sie abgeschnitten?','Ob die Balken eine schöne Farbe haben.','Sind Einheiten und Achsen beschriftet?','Wurde ein sinnvoller Zeitraum gewählt?'], hint:'Es geht um Aussagekraft, nicht Design.', explanation:'Wichtig sind Achsenskalierung, Einheiten/Beschriftungen und der Zeitraum.'},
  {id:'s22', chapter:'stats', type:'choice', answer:0, sub:'Cherry Picking', prompt:'Eine Firma zeigt nur den einen Monat mit dem höchsten Umsatz und verschweigt den Rest des Jahres. Wie nennt man so etwas am ehesten?', options:['Cherry Picking','Median','Spannweite'], hint:'Man pickt sich nur passende Daten heraus.', explanation:'Cherry Picking bedeutet, nur die Daten zu wählen, die zur gewünschten Aussage passen.'},
  {id:'s23', chapter:'stats', type:'choice', answer:1, sub:'Korrelation', prompt:'Im Sommer steigen Eisverkäufe und Sonnenbrände. Welche Aussage ist sauber?', options:['Eis verursacht Sonnenbrände.','Es gibt einen Zusammenhang; die Ursache kann z. B. Hitze/Sonne sein.','Sonnenbrand verkauft Eis.'], hint:'Zusammenhang heißt nicht automatisch Ursache.', explanation:'Korrelation ist kein Beweis für Ursache. Ein dritter Faktor, z. B. Sonne/Hitze, kann beide Werte beeinflussen.'},
  {id:'s24', chapter:'stats', type:'input', numeric:true, answer:120, unit:'%', sub:'Kreisdiagramm prüfen', prompt:'Ein Kreisdiagramm hat Anteile 40 %, 35 %, 25 % und 20 %. Wie viel Prozent ergibt die Summe?', hint:'Addiere alle Prozentwerte.', explanation:'40+35+25+20=120 %. Ein Kreisdiagramm sollte normalerweise 100 % ergeben.'},
  {id:'s25', chapter:'stats', type:'choice', answer:2, sub:'Kreisdiagramm prüfen', prompt:'Die Anteile in einem Kreisdiagramm ergeben zusammen 120 %. Was bedeutet das?', options:['Das ist perfekt, weil 120 größer ist.','Der Median ist 120.','Die Darstellung ist wahrscheinlich fehlerhaft oder die Kategorien überschneiden sich.'], hint:'Bei einem Kreisdiagramm ist der ganze Kreis 100 %.', explanation:'Ein Kreisdiagramm stellt ein Ganzes dar. Die Anteile sollten 100 % ergeben, außer Kategorien überschneiden sich und es wird klar erklärt.'},
  {id:'s26', chapter:'stats', type:'input', numeric:true, answer:51.2, tolerance:0.05, sub:'Mittelwert mit Ausreißer', prompt:'Berechne den Mittelwert: 5, 6, 6, 7, 232', hint:'Erst Summe bilden, dann durch 5 teilen.', explanation:'5+6+6+7+232=256. 256:5=51,2.'},
  {id:'s27', chapter:'stats', type:'input', numeric:true, answer:6, sub:'Median mit Ausreißer', prompt:'Bestimme den Median: 5, 6, 6, 7, 232', hint:'Die Liste ist schon sortiert. Nimm die Mitte.', explanation:'Der mittlere Wert ist 6. Der Median wird vom Ausreißer 232 kaum beeinflusst.'},
  {id:'s28', chapter:'stats', type:'choice', answer:1, sub:'Ausreißer', prompt:'Bei den Werten 5, 6, 6, 7, 232: Welcher Wert beschreibt die „typische Mitte“ besser?', options:['Der Mittelwert 51,2, weil er größer ist.','Der Median 6, weil 232 ein starker Ausreißer ist.','Die Spannweite, weil sie immer der Durchschnitt ist.'], hint:'Welche Kennzahl wird von 232 weniger verzerrt?', explanation:'Der Median 6 beschreibt die typische Mitte besser, weil 232 den Mittelwert stark nach oben zieht.'},
  {id:'s29', chapter:'stats', type:'choice', answer:0, sub:'Unehrliche Achse', prompt:'Ein Diagramm hat keine Achsenbeschriftung und keine Einheit. Was ist daran schlecht?', options:['Man weiß nicht sicher, was die Zahlen bedeuten.','Das Diagramm ist dadurch immer richtig.','Ohne Einheit ist es automatisch ein Median.'], hint:'Kannst du erkennen, ob es Euro, cm, Prozent oder Stück sind?', explanation:'Ohne Achsenbeschriftung und Einheit kann man eine Statistik leicht falsch verstehen.'},
  {id:'s30', chapter:'stats', type:'choice', answer:2, sub:'Relative Darstellung', prompt:'Ein Preis steigt von 1 € auf 2 €. Werbung sagt: „nur +1 €“. Was fehlt zur vollständigen Einordnung?', options:['Die Schuhgröße.','Der y-Achsenabschnitt.','Dass es relativ eine Verdopplung bzw. +100 % ist.'], hint:'Vergleiche den Anstieg mit dem Startwert.', explanation:'Absolut sind es +1 €. Relativ zum Startwert 1 € ist das +100 %.'},
  {id:'l23', chapter:'linBasic', type:'choice', answer:0, sub:'Graph lesen', prompt:'Der Graph zeigt eine Gerade. Welche Steigung hat sie?', options:['m = 2','m = −2','m = 1'], hint:'Gehe von (0|1) zu (1|3): 1 nach rechts, 2 nach oben.', explanation:'Die Gerade geht pro 1 Schritt nach rechts 2 nach oben. Also m=2.', graph:{title:'Gerade durch (0|1) und (1|3)', xMin:-4,xMax:4,yMin:-4,yMax:6, lines:[{m:2,b:1,label:'f'}], points:[{x:0,y:1,label:'(0|1)'},{x:1,y:3,label:'(1|3)'}]}},
  {id:'l24', chapter:'linBasic', type:'input', numeric:true, answer:1, sub:'Graph lesen', prompt:'Lies den y-Achsenabschnitt b aus dem Graphen ab.', hint:'b ist der y-Wert bei x=0.', explanation:'Die Gerade schneidet die y-Achse bei y=1. Also b=1.', graph:{title:'y-Achsenabschnitt ablesen', xMin:-4,xMax:4,yMin:-4,yMax:6, lines:[{m:2,b:1,label:'f'}], points:[{x:0,y:1,label:'b=1'}]}},
  {id:'l25', chapter:'linBasic', type:'input', numeric:true, answer:-2, sub:'Nullstelle aus Graph', prompt:'Lies die Nullstelle aus dem Graphen ab.', hint:'Suche den Schnittpunkt mit der x-Achse. Der y-Wert ist dort 0.', explanation:'Die Gerade y=x+2 trifft die x-Achse bei x=−2.', graph:{title:'Nullstelle erkennen', xMin:-5,xMax:5,yMin:-4,yMax:6, lines:[{m:1,b:2,label:'f'}], points:[{x:-2,y:0,label:'N'}]}},
  {id:'l26', chapter:'linBasic', type:'choice', answer:1, sub:'Graph vergleichen', prompt:'Welche Gleichung passt zum Graphen?', options:['f(x)=−x+3','f(x)=−2x+3','f(x)=2x+3'], hint:'b ist 3. Die Gerade fällt stark: pro 1 nach rechts 2 runter.', explanation:'b=3 und m=−2. Also f(x)=−2x+3.', graph:{title:'Passende Gleichung wählen', xMin:-3,xMax:4,yMin:-5,yMax:6, lines:[{m:-2,b:3,label:'f'}], points:[{x:0,y:3,label:'(0|3)'},{x:1,y:1,label:'(1|1)'}]}},
  {id:'l27', chapter:'linBasic', type:'graphSlider', answer:{m:2,b:1}, sub:'Interaktiver Graph', prompt:'Stelle mit den Reglern die Gerade y = 2x + 1 ein.', hint:'Erst b=1 einstellen. Dann m=2 einstellen.', explanation:'Für y=2x+1 ist m=2 und b=1.'},
  {id:'l28', chapter:'linBasic', type:'graphSlider', answer:{m:-1,b:3}, sub:'Interaktiver Graph', prompt:'Stelle mit den Reglern die Gerade y = −x + 3 ein.', hint:'b=3 und die Gerade fällt pro 1 nach rechts 1 nach unten.', explanation:'Für y=−x+3 ist m=−1 und b=3.'},
  {id:'l29', chapter:'linBasic', type:'input', textAnswers:['f(x)=-2x+3','y=-2x+3','-2x+3'], sub:'Graph zu Gleichung', prompt:'Bestimme die Funktionsgleichung zum Graphen.', hint:'Lies b bei x=0 ab und berechne m mit den zwei markierten Punkten.', explanation:'Von (0|3) nach (1|1): y ändert sich um −2 bei x +1. Also m=−2, b=3 → f(x)=−2x+3.', graph:{title:'Funktionsgleichung bestimmen', xMin:-3,xMax:4,yMin:-5,yMax:6, lines:[{m:-2,b:3,label:'f'}], points:[{x:0,y:3,label:'(0|3)'},{x:1,y:1,label:'(1|1)'}]}},
  {id:'l30', chapter:'linBasic', type:'choice', answer:2, sub:'Graph Eigenschaften', prompt:'Was passiert mit dem Graphen, wenn b größer wird?', options:['Er wird steiler.','Er dreht sich um die x-Achse.','Er verschiebt sich nach oben.'], hint:'b ist der Startwert bei der y-Achse.', explanation:'Ein größeres b verschiebt die Gerade nach oben. Die Steigung m ändert sich dadurch nicht.'},
  {id:'l31', chapter:'linBasic', type:'choice', answer:0, sub:'Graph Eigenschaften', prompt:'Was passiert mit dem Graphen, wenn m von 1 auf 3 steigt?', options:['Die Gerade wird steiler.','Der y-Achsenabschnitt bleibt automatisch 0.','Die Gerade wird immer waagerecht.'], hint:'m beschreibt die Steigung.', explanation:'Ein größeres m bedeutet: Die Gerade steigt stärker, sie wird steiler.'},
  {id:'l32', chapter:'linBasic', type:'input', numeric:true, answer:4, sub:'Graph Punkt ablesen', prompt:'Lies f(1) aus dem Graphen ab.', hint:'Gehe bei x=1 nach oben bis zur Geraden und lies y ab.', explanation:'Bei x=1 ist y=4.', graph:{title:'Funktionswert ablesen', xMin:-4,xMax:4,yMin:-2,yMax:7, lines:[{m:1,b:3,label:'f'}], points:[{x:1,y:4,label:'f(1)=4'}]}},
  {id:'l33', chapter:'linBasic', type:'input', numeric:true, answer:-1, sub:'Graph Steigung', prompt:'Die Gerade geht durch (0|2) und (3|−1). Berechne die Steigung.', hint:'m=(y₂−y₁):(x₂−x₁).', explanation:'m=(−1−2):(3−0)=−3:3=−1.', graph:{title:'Steigung aus zwei Punkten', xMin:-3,xMax:5,yMin:-3,yMax:5, lines:[{m:-1,b:2,label:'f'}], points:[{x:0,y:2,label:'(0|2)'},{x:3,y:-1,label:'(3|-1)'}]}},
  {id:'u23', chapter:'linUse', type:'choice', answer:0, sub:'Tarife Graph', prompt:'Zwei Tarife schneiden sich im Graphen. Was bedeutet der Schnittpunkt inhaltlich?', options:['Bei dieser Minutenanzahl kosten beide Tarife gleich viel.','Ab dort telefoniert niemand mehr.','Der y-Achsenabschnitt ist immer 0.'], hint:'Im Schnittpunkt haben beide Geraden denselben y-Wert.', explanation:'Der Schnittpunkt bedeutet: gleiche Kosten bei gleicher Minutenanzahl.', graph:{title:'Tarif A und Tarif B', xMin:0,xMax:800,yMin:0,yMax:12, xLabel:'Minuten', yLabel:'Euro', lines:[{m:0.013,b:0,label:'A'},{m:0.003,b:5,label:'B'}], points:[{x:500,y:6.5,label:'S'}]}},
  {id:'u24', chapter:'linUse', type:'input', numeric:true, answer:500, unit:'min', sub:'Tarife Schnittpunkt', prompt:'Tarif A: K(x)=0,013x, Tarif B: K(x)=0,003x+5. Bei wie vielen Minuten kosten beide gleich viel?', hint:'Setze 0,013x = 0,003x + 5.', explanation:'0,013x=0,003x+5 → 0,010x=5 → x=500 Minuten.', graph:{title:'Schnittpunkt der Tarife', xMin:0,xMax:800,yMin:0,yMax:12, xLabel:'Minuten', yLabel:'Euro', lines:[{m:0.013,b:0,label:'A'},{m:0.003,b:5,label:'B'}], points:[{x:500,y:6.5,label:'500 min'}]}},
  {id:'u25', chapter:'linUse', type:'choice', answer:1, sub:'Vorräte Graph', prompt:'Der Graph zeigt M(t)=48−1,5t. Was bedeutet der y-Achsenabschnitt 48?', options:['Nach 48 Tagen ist die Milch leer.','Am Anfang sind 48 Liter Milch vorhanden.','Pro Tag werden 48 Liter verbraucht.'], hint:'y-Achsenabschnitt bedeutet x=0, also Start.', explanation:'Bei t=0 sind 48 Liter vorhanden. Das ist der Startwert.', graph:{title:'Milchvorrat', xMin:0,xMax:35,yMin:0,yMax:55,xLabel:'Tage',yLabel:'Liter', lines:[{m:-1.5,b:48,label:'M'}], points:[{x:0,y:48,label:'Start'},{x:32,y:0,label:'leer'}]}},
  {id:'u26', chapter:'linUse', type:'input', numeric:true, answer:-1.5, tolerance:0.01, sub:'Vorräte Graph', prompt:'Der Graph M(t)=48−1,5t fällt. Wie groß ist die Steigung?', hint:'Die Zahl vor t ist die Steigung.', explanation:'Die Steigung ist −1,5. Das bedeutet: pro Tag 1,5 Liter weniger.', graph:{title:'Negative Steigung bei Verbrauch', xMin:0,xMax:35,yMin:0,yMax:55,xLabel:'Tage',yLabel:'Liter', lines:[{m:-1.5,b:48,label:'M'}]}},
  {id:'u27', chapter:'linUse', type:'input', numeric:true, answer:20, sub:'Papier Graph', prompt:'Lies aus dem Graphen ab: In welcher Kalenderwoche ist das Umweltpapier leer?', hint:'Leer bedeutet: Graph schneidet die x-Achse.', explanation:'Die Gerade P(x)=−2,2x+44 hat die Nullstelle bei x=20.', graph:{title:'Umweltpapier P(x)=−2,2x+44', xMin:0,xMax:22,yMin:0,yMax:46,xLabel:'KW',yLabel:'Pakete', lines:[{m:-2.2,b:44,label:'P'}], points:[{x:10,y:22,label:'KW10'},{x:15,y:11,label:'KW15'},{x:20,y:0,label:'leer'}]}},
  {id:'u28', chapter:'linUse', type:'choice', answer:2, sub:'Sachgraph deuten', prompt:'Bei einem Vorratsgraphen fällt die Gerade von links nach rechts. Was heißt das?', options:['Der Vorrat wird mehr.','Der Vorrat bleibt gleich.','Der Vorrat wird weniger.'], hint:'Fallende Gerade: y-Werte werden kleiner.', explanation:'Wenn der Graph fällt, wird der Vorrat mit der Zeit kleiner.'},
  {id:'u29', chapter:'linUse', type:'input', numeric:true, answer:6, unit:'€', tolerance:0.01, mustUnit:true, sub:'Dreisatz/Kosten', prompt:'Kabel kosten 3 € pro Meter. Berechne den Preis für 2 m.', hint:'Preis pro Meter mal Meter.', explanation:'3 € · 2 = 6 €.'},
  {id:'u30', chapter:'linUse', type:'input', numeric:true, answer:75, unit:'€', tolerance:0.01, mustUnit:true, sub:'Dreisatz/Kosten', prompt:'Kabel kosten 3 € pro Meter. Berechne den Preis für 25 m.', hint:'25 · 3.', explanation:'25 · 3 € = 75 €.'},
  {id:'b30', chapter:'basics', type:'choice', answer:1, sub:'Pythagoras', prompt:'Wann darfst du den Satz des Pythagoras benutzen?', options:['Bei jedem Dreieck.','Nur bei einem rechtwinkligen Dreieck.','Nur bei Kreisen.'], hint:'Pythagoras braucht einen rechten Winkel.', explanation:'Der Satz des Pythagoras gilt nur im rechtwinkligen Dreieck.'},
  {id:'b31', chapter:'basics', type:'input', numeric:true, answer:5, unit:'m', mustUnit:true, sub:'Pythagoras', prompt:'Eine Leiter bildet mit Boden und Wand ein rechtwinkliges Dreieck. Abstand zur Wand: 3 m, Höhe an der Wand: 4 m. Wie lang ist die Leiter?', hint:'Die Leiter ist die längste Seite c. Rechne c²=3²+4².', explanation:'c²=3²+4²=9+16=25. c=√25=5 m.'},
  {id:'b32', chapter:'basics', type:'input', numeric:true, answer:10, unit:'m', mustUnit:true, sub:'Pythagoras', prompt:'Ein Rechteck ist 6 m breit und 8 m lang. Wie lang ist die Diagonale?', hint:'Die Diagonale ist c. Rechne 6²+8².', explanation:'c²=6²+8²=36+64=100. c=10 m.'},
  {id:'b33', chapter:'basics', type:'input', numeric:true, answer:12, unit:'m', mustUnit:true, sub:'Pythagoras Kathete', prompt:'Ein rechtwinkliges Dreieck hat c=13 m und b=5 m. Berechne a.', hint:'Wenn c gegeben ist und eine Kathete fehlt: a²=c²−b².', explanation:'a²=13²−5²=169−25=144. a=√144=12 m.'},
  {id:'b34', chapter:'basics', type:'choice', answer:2, sub:'Pythagoras Rechenweg', prompt:'Welche Rechenweg-Zeile passt für ein rechtwinkliges Dreieck mit a=9 m und b=12 m, gesucht c?', options:['c = 9+12','c² = 9²−12²','c² = 9²+12²'], hint:'Wenn c gesucht ist, addierst du die Quadrate der Katheten.', explanation:'Für die Hypotenuse gilt c²=a²+b², also c²=9²+12².'},
  {id:'b35', chapter:'basics', type:'input', numeric:true, answer:15, unit:'m', mustUnit:true, sub:'Pythagoras', prompt:'Ein rechtwinkliges Dreieck hat a=9 m und b=12 m. Berechne c.', hint:'9²=81 und 12²=144.', explanation:'c²=81+144=225. c=√225=15 m.'},
  {id:'b36', chapter:'basics', type:'input', numeric:true, answer:12, unit:'m²', tolerance:0.01, mustUnit:true, sub:'Rechteck a·b', prompt:'Ein Lagerraum ist 4 m lang und 3 m breit. Berechne die Fläche.', hint:'Rechteck: A=a·b.', explanation:'A=4 m·3 m=12 m².'},
  {id:'b37', chapter:'basics', type:'input', textAnswers:['A=4m*3m=12m²','A=4*3=12m²','A=a*b=4*3=12m²','A=4m·3m=12m²','A=4·3=12m²'], sub:'Rechenweg aufstellen', prompt:'Stelle den Rechenweg für die Fläche auf: Ein Raum ist 4 m lang und 3 m breit. Schreibe kurz die Rechnung.', hint:'Du brauchst A=a·b und setzt 4 und 3 ein.', explanation:'Passender Rechenweg: A=a·b=4·3=12 m².'},
  {id:'b38', chapter:'basics', type:'input', numeric:true, answer:27, unit:'m²', tolerance:0.01, mustUnit:true, sub:'Rechteck a·b', prompt:'Ein Plakat ist 9 m breit und 3 m hoch. Wie groß ist die Fläche?', hint:'Breite mal Höhe.', explanation:'A=9·3=27 m².'},
  {id:'b39', chapter:'basics', type:'choice', answer:0, sub:'Rechenweg Textaufgabe', prompt:'Welche Reihenfolge ist bei Textaufgaben am sinnvollsten?', options:['Gegeben markieren → Gesucht notieren → Formel → Einsetzen → Antwortsatz','Ergebnis raten → Formel suchen → Einheit weglassen','Erst Antwortsatz schreiben → dann Zahlen suchen'], hint:'Erst verstehen, dann rechnen.', explanation:'Die sichere Reihenfolge ist: Gegeben, Gesucht, Formel, Einsetzen, Rechnung, Antwortsatz.'},
  {id:'b40', chapter:'basics', type:'input', numeric:true, answer:4, unit:'m', mustUnit:true, sub:'Kreis Durchmesser', prompt:'Ein Kreis hat den Radius r=2 m. Berechne den Durchmesser d.', hint:'d=2r.', explanation:'d=2·2 m=4 m.'},
  {id:'b41', chapter:'basics', type:'input', numeric:true, answer:12.57, unit:'m', tolerance:0.05, mustUnit:true, sub:'Kreis Umfang', prompt:'Ein runder Teich hat r=2 m. Berechne den Umfang U. Runde auf 2 Nachkommastellen.', hint:'U=2·π·r. Nimm π≈3,14.', explanation:'U=2·π·2≈12,57 m.'},
  {id:'b42', chapter:'basics', type:'input', numeric:true, answer:12.57, unit:'m²', tolerance:0.05, mustUnit:true, sub:'Kreis Fläche', prompt:'Ein Kreis hat r=2 m. Berechne die Fläche A. Runde auf 2 Nachkommastellen.', hint:'A=π·r². Erst 2² rechnen.', explanation:'A=π·2²=4π≈12,57 m².'},
  {id:'b43', chapter:'basics', type:'input', numeric:true, answer:18.85, unit:'m', tolerance:0.05, mustUnit:true, sub:'Kreis Umfang', prompt:'Ein rundes Beet hat den Durchmesser d=6 m. Berechne den Umfang.', hint:'Wenn d gegeben ist, kannst du U=π·d nutzen.', explanation:'U=π·6≈18,85 m.'},
  {id:'b44', chapter:'basics', type:'input', numeric:true, answer:28.27, unit:'m²', tolerance:0.05, mustUnit:true, sub:'Kreis Fläche', prompt:'Ein rundes Beet hat den Durchmesser d=6 m. Berechne die Fläche.', hint:'Erst r=d:2. Dann A=πr².', explanation:'r=6:2=3 m. A=π·3²=9π≈28,27 m².'},
  {id:'b45', chapter:'basics', type:'choice', answer:1, sub:'Kreis Rechenweg', prompt:'Welche Formel berechnet die Kreisfläche?', options:['U=2πr','A=πr²','A=a·b'], hint:'Fläche ist der Inhalt im Kreis, nicht der Rand.', explanation:'Die Kreisfläche berechnest du mit A=πr².'},
  {id:'b46', chapter:'basics', type:'choice', answer:2, sub:'Kreis Rechenweg', prompt:'Ein Kreis hat d=10 m. Was musst du vor der Flächenrechnung zuerst tun?', options:['d verdoppeln','d mit π addieren','r=d:2 rechnen'], hint:'Für A=πr² brauchst du den Radius.', explanation:'Bei d=10 m ist r=5 m. Erst danach kannst du A=πr² rechnen.'},
  {id:'b47', chapter:'basics', type:'input', numeric:true, answer:78.54, unit:'m²', tolerance:0.08, mustUnit:true, sub:'Kreis Textaufgabe', prompt:'Ein runder Teppich hat d=10 m. Wie groß ist seine Fläche?', hint:'Erst Radius berechnen: r=5 m.', explanation:'r=10:2=5 m. A=π·5²=25π≈78,54 m².'},
  {id:'b48', chapter:'basics', type:'input', numeric:true, answer:31.42, unit:'m', tolerance:0.08, mustUnit:true, sub:'Kreis Textaufgabe', prompt:'Um einen runden Garten mit d=10 m soll ein Zaun gebaut werden. Wie viele Meter Zaun braucht man ungefähr?', hint:'Zaun um den Rand = Umfang. U=πd.', explanation:'U=π·10≈31,42 m.'},
  {id:'s31', chapter:'stats', type:'choice', answer:0, sub:'Statistik Beschreibung', prompt:'Welche Beschreibung ist am saubersten? Werte: Montag 12 Fehler, Dienstag 9, Mittwoch 6.', options:['Die Fehlerzahl sinkt von 12 auf 6, also wird es weniger.','Die Firma ist perfekt.','Alles ist schlecht.'], hint:'Beschreibe neutral mit Zahlen.', explanation:'Eine gute Statistik-Beschreibung nennt den Trend und belegt ihn mit Zahlen.'},
  {id:'s32', chapter:'stats', type:'multi', answer:[0,1,3], sub:'Statistik Beschreibung', prompt:'Was gehört in eine gute Statistik-Beschreibung? Wähle alle richtigen Antworten.', options:['Einheit oder Thema nennen.','Höchsten und niedrigsten Wert nennen.','Ohne Zahlen übertreiben.','Auffälligkeiten oder Trend beschreiben.'], hint:'Eine Beschreibung soll verständlich und belegbar sein.', explanation:'Thema/Einheit, Extremwerte und Trend/Auffälligkeiten sind wichtig. Übertreiben ohne Zahlen ist nicht sauber.'},
  {id:'s33', chapter:'stats', type:'input', numeric:true, answer:6, sub:'Statistik Beschreibung', prompt:'Messwerte: 4, 5, 7, 10. Berechne die Spannweite, damit du die Streuung beschreiben kannst.', hint:'Größter Wert minus kleinster Wert.', explanation:'10−4=6.'},
  {id:'s34', chapter:'stats', type:'choice', answer:1, sub:'Statistik Interpretation', prompt:'Zwei Maschinen produzieren Schrauben. Maschine A: Spannweite 1 mm, Maschine B: Spannweite 8 mm. Welche Beschreibung passt?', options:['B ist gleichmäßiger.','A produziert gleichmäßiger, weil die Werte näher beieinander liegen.','Man kann Spannweiten nie vergleichen.'], hint:'Kleine Spannweite = weniger Streuung.', explanation:'Maschine A hat die kleinere Spannweite und wirkt deshalb gleichmäßiger.'},
  {id:'s35', chapter:'stats', type:'choice', answer:2, sub:'Statistik Beschreibung', prompt:'Ein Diagramm zeigt nur Prozentwerte, aber keine absolute Anzahl der Befragten. Was fehlt?', options:['Die Steigung m.','Der Umfang vom Kreis.','Die Stichprobengröße, also wie viele Personen befragt wurden.'], hint:'Sind 80 % von 5 Personen genauso sicher wie 80 % von 500 Personen?', explanation:'Ohne Stichprobengröße kann man die Aussagekraft schlechter einschätzen.'},
  {id:'s36', chapter:'stats', type:'choice', answer:0, sub:'Statistik Beschreibung', prompt:'Welche Formulierung ist vorsichtig und mathematisch sauber?', options:['In dieser Stichprobe ist A häufiger als B.','A ist für immer besser als B.','Alle Menschen wählen A.'], hint:'Statistiken gelten zuerst für die untersuchten Daten.', explanation:'„In dieser Stichprobe“ ist vorsichtig und sauber, weil man nicht zu stark verallgemeinert.'},
  {id:'s37', chapter:'stats', type:'input', numeric:true, answer:25, unit:'%', tolerance:0.01, sub:'Statistik Prozent', prompt:'In einer Klasse wählen 5 von 20 Personen Option A. Wie viel Prozent sind das?', hint:'5:20=0,25. Dann ·100.', explanation:'5/20=0,25=25 %.'},
  {id:'s38', chapter:'stats', type:'choice', answer:1, sub:'Statistik Fake-Check', prompt:'Eine Werbung sagt: „50 % mehr!“ Der alte Wert war 2, der neue Wert ist 3. Warum wirkt das groß?', options:['Weil der neue Wert 50 Prozentpunkte größer ist.','Weil bei kleinen Ausgangswerten relative Prozentangaben groß klingen können.','Weil 2 größer als 3 ist.'], hint:'Von 2 auf 3 ist absolut nur +1.', explanation:'Relativ ist +1 von 2 = +50 %. Absolut ist es nur 1 mehr.'},
  {id:'l34', chapter:'linBasic', type:'choice', answer:0, sub:'Text zu Funktion', prompt:'Ein Taxi kostet 4 € Startgebühr und 2 € pro Kilometer. Was ist x sinnvollerweise?', options:['x = gefahrene Kilometer','x = Startgebühr','x = Farbe des Taxis'], hint:'x ist die veränderliche Größe.', explanation:'x steht sinnvollerweise für die gefahrenen Kilometer.'},
  {id:'l35', chapter:'linBasic', type:'input', textAnswers:['K(x)=2x+4','y=2x+4','2x+4'], sub:'Text zu Funktion', prompt:'Taxi: 4 € Startgebühr und 2 € pro Kilometer. Stelle die Kostenfunktion auf.', hint:'Startgebühr ist b. Preis pro km ist m.', explanation:'K(x)=2x+4.'},
  {id:'l36', chapter:'linBasic', type:'choice', answer:2, sub:'Rechenweg Funktion', prompt:'Welche Rechenweg-Zeile passt, um bei K(x)=2x+4 die Kosten für 7 km zu berechnen?', options:['K(7)=2+7+4','K(2)=7·4','K(7)=2·7+4'], hint:'Für x setzt du 7 ein.', explanation:'K(7)=2·7+4=18.'},
  {id:'l37', chapter:'linBasic', type:'input', numeric:true, answer:18, unit:'€', mustUnit:true, sub:'Text zu Funktion', prompt:'Taxi: K(x)=2x+4. Berechne die Kosten für 7 km.', hint:'Setze x=7 ein.', explanation:'K(7)=2·7+4=14+4=18 €.'},
  {id:'l38', chapter:'linBasic', type:'choice', answer:1, sub:'Funktion erkennen', prompt:'Welche Situation passt zu einer linearen Funktion?', options:['Ein Kreis wird immer runder.','Ein Speicher hat 100 L und verliert jede Stunde 5 L.','Eine Note ist ein Name.'], hint:'Linear heißt oft: pro Schritt immer gleiche Änderung.', explanation:'100 L Start und jede Stunde −5 L ist linear: R(t)=100−5t.'},

function graphSVG(g, small=false){
  const W=520,H=360,pad=46;const xMin=g.xMin??-5,xMax=g.xMax??5,yMin=g.yMin??-5,yMax=g.yMax??5;
  const sx=x=>pad+(x-xMin)/(xMax-xMin)*(W-2*pad);const sy=y=>H-pad-(y-yMin)/(yMax-yMin)*(H-2*pad);
  const grid=[];const xStep=niceStep(xMin,xMax), yStep=niceStep(yMin,yMax);
  for(let x=Math.ceil(xMin/xStep)*xStep;x<=xMax+1e-9;x+=xStep){const X=sx(x);grid.push(`<line x1="${X}" y1="${pad}" x2="${X}" y2="${H-pad}" stroke="var(--line)" stroke-width="1"/>`);if(Math.abs(x)>1e-9)grid.push(`<text x="${X}" y="${H-pad+20}" text-anchor="middle" font-size="12" fill="var(--muted)">${fmt(Math.round(x*100)/100)}</text>`)}
  for(let y=Math.ceil(yMin/yStep)*yStep;y<=yMax+1e-9;y+=yStep){const Y=sy(y);grid.push(`<line x1="${pad}" y1="${Y}" x2="${W-pad}" y2="${Y}" stroke="var(--line)" stroke-width="1"/>`);if(Math.abs(y)>1e-9)grid.push(`<text x="${pad-10}" y="${Y+4}" text-anchor="end" font-size="12" fill="var(--muted)">${fmt(Math.round(y*100)/100)}</text>`)}
  const axes=[]; if(xMin<=0&&xMax>=0)axes.push(`<line x1="${sx(0)}" y1="${pad}" x2="${sx(0)}" y2="${H-pad}" stroke="var(--muted)" stroke-width="2"/>`); if(yMin<=0&&yMax>=0)axes.push(`<line x1="${pad}" y1="${sy(0)}" x2="${W-pad}" y2="${sy(0)}" stroke="var(--muted)" stroke-width="2"/>`);
  const lines=(g.lines||[]).map((ln,i)=>{const x1=xMin,x2=xMax,y1=ln.m*x1+ln.b,y2=ln.m*x2+ln.b;return `<line x1="${sx(x1)}" y1="${sy(y1)}" x2="${sx(x2)}" y2="${sy(y2)}" stroke="${i===0?'var(--primary)':'var(--accent)'}" stroke-width="4" stroke-linecap="round"/><text x="${sx(xMax)-36}" y="${sy(y2)-8}" fill="${i===0?'var(--primary)':'var(--accent)'}" font-weight="900">${esc(ln.label||'')}</text>`}).join('');
  const pts=(g.points||[]).map(pt=>`<g><circle cx="${sx(pt.x)}" cy="${sy(pt.y)}" r="6" fill="var(--bad)"/><text x="${sx(pt.x)+8}" y="${sy(pt.y)-8}" fill="var(--text)" font-size="13" font-weight="900">${esc(pt.label||`(${pt.x}|${pt.y})`)}</text></g>`).join('');
  const labels=`<text x="${W/2}" y="24" text-anchor="middle" font-size="16" font-weight="900" fill="var(--text)">${esc(g.title||'Graph')}</text><text x="${W-pad}" y="${H-10}" text-anchor="end" font-size="13" fill="var(--muted)">${esc(g.xLabel||'x')}</text><text x="18" y="${pad-16}" font-size="13" fill="var(--muted)">${esc(g.yLabel||'y')}</text>`;
  return `<svg class="graphSvg ${small?'graphSmall':''}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(g.title||'Graph')}">${labels}${grid.join('')}${axes.join('')}${lines}${pts}</svg>`;
}
function niceStep(min,max){const span=Math.abs(max-min);if(span<=8)return 1;if(span<=25)return 5;if(span<=80)return 10;if(span<=200)return 20;return 100;}
function chartSVG(c){
  const W=520,H=340,pad=52;const vals=c.values||[];const yMin=c.yMin??0,yMax=c.yMax??Math.max(...vals.map(v=>v.value),10);const innerW=W-2*pad,innerH=H-2*pad;const bw=innerW/Math.max(vals.length,1)*0.58;
  const sy=y=>H-pad-(y-yMin)/(yMax-yMin)*innerH;let grid='';const step=niceStep(yMin,yMax);for(let y=Math.ceil(yMin/step)*step;y<=yMax+1e-9;y+=step){const Y=sy(y);grid+=`<line x1="${pad}" y1="${Y}" x2="${W-pad}" y2="${Y}" stroke="var(--line)"/><text x="${pad-10}" y="${Y+4}" text-anchor="end" font-size="12" fill="var(--muted)">${fmt(y)}%</text>`}
  const bars=vals.map((v,i)=>{const x=pad+(i+.5)*innerW/vals.length-bw/2;const y=sy(v.value);const base=sy(yMin);return `<rect x="${x}" y="${y}" width="${bw}" height="${base-y}" rx="10" fill="var(--primary)" opacity=".86"/><text x="${x+bw/2}" y="${y-8}" text-anchor="middle" font-size="14" font-weight="900" fill="var(--text)">${fmt(v.value)}%</text><text x="${x+bw/2}" y="${H-pad+24}" text-anchor="middle" font-size="14" fill="var(--text)">${esc(v.label)}</text>`}).join('');
  return `<svg class="chartSvg" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.title||'Diagramm')}"><text x="${W/2}" y="24" text-anchor="middle" font-size="16" font-weight="900" fill="var(--text)">${esc(c.title||'Diagramm')}</text>${grid}<line x1="${pad}" y1="${sy(yMin)}" x2="${W-pad}" y2="${sy(yMin)}" stroke="var(--muted)" stroke-width="2"/>${bars}</svg>`;
}
